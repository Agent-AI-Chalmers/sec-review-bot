<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 820" role="img" aria-labelledby="title description">
  <title id="title">Local integrated deployment shape</title>
  <desc id="description">GitHub and an operator browser connect to Docker Compose services, while the host Execution Worker runs agent sandboxes.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.1" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head" />
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #263244; }
      .zone { stroke-width: 1.25; }
      .external-zone { fill: #f8fafc; stroke: #d8dee8; }
      .compose-zone { fill: #f8fbfa; stroke: #c7d8d2; }
      .host-zone { fill: #fffaf6; stroke: #e2d3c6; }
      .zone-label { font-size: 21px; font-weight: 650; fill: #475569; }
      .node { filter: url(#shadow); }
      .node-surface { fill: #ffffff; stroke: #d6dce5; stroke-width: 1.25; }
      .node-accent { fill: none; stroke-width: 3; stroke-linecap: round; }
      .external-node .node-accent { stroke: #64748b; }
      .control-node .node-accent { stroke: #2878b5; }
      .execution-node .node-accent { stroke: #b85c38; }
      .memory-node .node-accent { stroke: #2f806a; }
      .storage-node .node-accent { stroke: #9a6a22; }
      .sandbox-node .node-accent { stroke: #7c5c9e; }
      .node-label { font-size: 17px; font-weight: 550; }
      .edge { fill: none; stroke: #718096; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .edge.dashed { stroke-dasharray: 6 5; }
      .arrow-head { fill: #718096; }
    </style>
  </defs>
  <rect x="20" y="24" width="220" height="760" rx="7" class="zone external-zone" />
  <text x="130" y="56" class="zone-label" text-anchor="middle">
    <tspan x="130" dy="0">External</tspan>
  </text>
  <rect x="270" y="24" width="930" height="760" rx="7" class="zone compose-zone" />
  <text x="735" y="56" class="zone-label" text-anchor="middle">
    <tspan x="735" dy="0">Docker Compose</tspan>
  </text>
  <rect x="1230" y="24" width="240" height="760" rx="7" class="zone host-zone" />
  <text x="1350" y="56" class="zone-label" text-anchor="middle">
    <tspan x="1350" dy="0">Host</tspan>
  </text>
  <path d="M 210 151 L 300 151" class="edge" marker-end="url(#arrow)" />
  <path d="M 470 151 L 510 151" class="edge" marker-end="url(#arrow)" />
  <path d="M 680 151 L 720 151" class="edge" marker-end="url(#arrow)" marker-start="url(#arrow)" />
  <path d="M 900 151 L 940 151" class="edge" marker-end="url(#arrow)" marker-start="url(#arrow)" />
  <path d="M 1025 187 L 1025 315" class="edge" marker-end="url(#arrow)" />
  <path d="M 1110 351 L 1210 351 L 1210 478 L 1260 478" class="edge" marker-end="url(#arrow)" marker-start="url(#arrow)" />
  <path d="M 1350 537 L 1350 650" class="edge" marker-end="url(#arrow)" />
  <path d="M 210 351 L 300 351" class="edge" marker-end="url(#arrow)" />
  <path d="M 470 351 L 490 351 L 490 205 L 720 205 L 720 169" class="edge" marker-end="url(#arrow)" />
  <path d="M 680 169 L 700 169 L 700 560 L 975 560 L 975 590" class="edge" marker-end="url(#arrow)" />
  <path d="M 810 187 L 810 590" class="edge" marker-end="url(#arrow)" />
  <path d="M 600 387 L 600 560 L 740 560 L 740 590" class="edge" marker-end="url(#arrow)" />
  <path d="M 1110 169 L 1140 169 L 1140 560 L 1070 560 L 1070 590" class="edge" marker-end="url(#arrow)" />
  <path d="M 1025 387 L 1025 590" class="edge" marker-end="url(#arrow)" marker-start="url(#arrow)" />
  <path d="M 1260 514 L 1190 514 L 1190 631 L 1130 631" class="edge" marker-end="url(#arrow)" marker-start="url(#arrow)" />
  <path d="M 1260 478 L 1180 478 L 1180 420 L 710 420 L 710 369 L 690 369" class="edge dashed" marker-end="url(#arrow)" marker-start="url(#arrow)" />
  <g id="github" class="node external-node">
    <rect x="50" y="115" width="160" height="72" rx="8" class="node-surface" />
    <path d="M 58 116 H 202" class="node-accent" />
    <text x="130" y="156" class="node-label" text-anchor="middle">
      <tspan x="130" dy="0">GitHub</tspan>
    </text>
  </g>
  <g id="browser" class="node external-node">
    <rect x="50" y="315" width="160" height="72" rx="8" class="node-surface" />
    <path d="M 58 316 H 202" class="node-accent" />
    <text x="130" y="347" class="node-label" text-anchor="middle">
      <tspan x="130" dy="0">Operator</tspan>
      <tspan x="130" dy="18">browser</tspan>
    </text>
  </g>
  <g id="tunnel" class="node control-node">
    <rect x="300" y="115" width="170" height="72" rx="8" class="node-surface" />
    <path d="M 308 116 H 462" class="node-accent" />
    <text x="385" y="147" class="node-label" text-anchor="middle">
      <tspan x="385" dy="0">Cloudflare</tspan>
      <tspan x="385" dy="18">Tunnel</tspan>
    </text>
  </g>
  <g id="integration" class="node control-node">
    <rect x="510" y="115" width="170" height="72" rx="8" class="node-surface" />
    <path d="M 518 116 H 672" class="node-accent" />
    <text x="595" y="147" class="node-label" text-anchor="middle">
      <tspan x="595" dy="0">GitHub</tspan>
      <tspan x="595" dy="18">Integration</tspan>
    </text>
  </g>
  <g id="control" class="node control-node">
    <rect x="720" y="115" width="180" height="72" rx="8" class="node-surface" />
    <path d="M 728 116 H 892" class="node-accent" />
    <text x="810" y="147" class="node-label" text-anchor="middle">
      <tspan x="810" dy="0">Review Control</tspan>
      <tspan x="810" dy="18">Plane</tspan>
    </text>
  </g>
  <g id="gateway" class="node execution-node">
    <rect x="940" y="115" width="170" height="72" rx="8" class="node-surface" />
    <path d="M 948 116 H 1102" class="node-accent" />
    <text x="1025" y="147" class="node-label" text-anchor="middle">
      <tspan x="1025" dy="0">Execution</tspan>
      <tspan x="1025" dy="18">Gateway</tspan>
    </text>
  </g>
  <g id="ui" class="node control-node">
    <rect x="300" y="315" width="170" height="72" rx="8" class="node-surface" />
    <path d="M 308 316 H 462" class="node-accent" />
    <text x="385" y="356" class="node-label" text-anchor="middle">
      <tspan x="385" dy="0">Control Plane UI</tspan>
    </text>
  </g>
  <g id="temporal" class="node execution-node">
    <rect x="940" y="315" width="170" height="72" rx="8" class="node-surface" />
    <path d="M 948 316 H 1102" class="node-accent" />
    <text x="1025" y="356" class="node-label" text-anchor="middle">
      <tspan x="1025" dy="0">Temporal Server</tspan>
    </text>
  </g>
  <g id="catalog" class="node memory-node">
    <rect x="510" y="315" width="180" height="72" rx="8" class="node-surface" />
    <path d="M 518 316 H 682" class="node-accent" />
    <text x="600" y="347" class="node-label" text-anchor="middle">
      <tspan x="600" dy="0">Memory Catalog</tspan>
      <tspan x="600" dy="18">Server</tspan>
    </text>
  </g>
  <g id="postgres" class="node storage-node">
    <rect x="700" y="590" width="190" height="82" rx="8" class="node-surface" />
    <path d="M 708 591 H 882" class="node-accent" />
    <text x="795" y="636" class="node-label" text-anchor="middle">
      <tspan x="795" dy="0">PostgreSQL</tspan>
    </text>
  </g>
  <g id="storage" class="node storage-node">
    <rect x="940" y="590" width="190" height="82" rx="8" class="node-surface" />
    <path d="M 948 591 H 1122" class="node-accent" />
    <text x="1035" y="636" class="node-label" text-anchor="middle">
      <tspan x="1035" dy="0">Object Storage</tspan>
    </text>
  </g>
  <g id="worker" class="node execution-node">
    <rect x="1260" y="455" width="180" height="82" rx="8" class="node-surface" />
    <path d="M 1268 456 H 1432" class="node-accent" />
    <text x="1350" y="501" class="node-label" text-anchor="middle">
      <tspan x="1350" dy="0">Execution Worker</tspan>
    </text>
  </g>
  <g id="sandbox" class="node sandbox-node">
    <rect x="1260" y="650" width="180" height="82" rx="8" class="node-surface" />
    <path d="M 1268 651 H 1432" class="node-accent" />
    <text x="1350" y="696" class="node-label" text-anchor="middle">
      <tspan x="1350" dy="0">Docker sandbox</tspan>
    </text>
  </g>
</svg>