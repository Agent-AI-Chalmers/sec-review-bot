    <path d="M 928 116 H 1092" class="node-accent" />
    <text x="1010" y="156" class="node-label" text-anchor="middle">
      <tspan x="1010" dy="0">Review Runs</tspan>
    </text>
  </g>
  <g id="gateway" class="node execution-node">
