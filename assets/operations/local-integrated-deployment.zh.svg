      <tspan x="1225" dy="0">Execution</tspan>
      <tspan x="1225" dy="18">Gateway</tspan>
    </text>
  </g>
  <g id="ui" class="node control-node">
    <rect x="500" y="315" width="170" height="72" rx="8" class="node-surface" />
    <path d="M 508 316 H 662" class="node-accent" />
    <text x="585" y="356" class="node-label" text-anchor="middle">
      <tspan x="585" dy="0">Control Plane UI</tspan>
    </text>
  </g>
  <g id="temporal" class="node execution-node">
    <rect x="1140" y="315" width="170" height="72" rx="8" class="node-surface" />
    <path d="M 1148 316 H 1302" class="node-accent" />
    <text x="1225" y="356" class="node-label" text-anchor="middle">
      <tspan x="1225" dy="0">Temporal Server</tspan>
    </text>
  </g>
  <g id="catalog" class="node memory-node">
    <rect x="710" y="315" width="180" height="72" rx="8" class="node-surface" />
    <path d="M 718 316 H 882" class="node-accent" />
    <text x="800" y="347" class="node-label" text-anchor="middle">
      <tspan x="800" dy="0">Memory Catalog</tspan>
      <tspan x="800" dy="18">Server</tspan>
    </text>
  </g>
  <g id="postgres" class="node storage-node">
    <rect x="900" y="590" width="190" height="82" rx="8" class="node-surface" />
    <path d="M 908 591 H 1082" class="node-accent" />
    <text x="995" y="636" class="node-label" text-anchor="middle">
      <tspan x="995" dy="0">PostgreSQL</tspan>
    </text>
  </g>
  <g id="storage" class="node storage-node">
    <rect x="1140" y="590" width="190" height="82" rx="8" class="node-surface" />
    <path d="M 1148 591 H 1322" class="node-accent" />
    <text x="1235" y="627" class="node-label" text-anchor="middle">
      <tspan x="1235" dy="0">RustFS</tspan>
      <tspan x="1235" dy="18">对象存储</tspan>
    </text>
  </g>
  <g id="execution-worker" class="node execution-node">
    <rect x="1450" y="265" width="200" height="72" rx="8" class="node-surface" />
    <path d="M 1458 266 H 1642" class="node-accent" />
    <text x="1550" y="306" class="node-label" text-anchor="middle">
      <tspan x="1550" dy="0">Execution Worker</tspan>
    </text>
  </g>
  <g id="memory-extraction-worker" class="node memory-node">
    <rect x="1450" y="390" width="200" height="72" rx="8" class="node-surface" />
    <path d="M 1458 391 H 1642" class="node-accent" />
    <text x="1550" y="422" class="node-label" text-anchor="middle">
      <tspan x="1550" dy="0">Memory Extraction</tspan>
      <tspan x="1550" dy="18">Worker</tspan>
    </text>
  </g>
  <g id="memory-maintenance-worker" class="node memory-node">
    <rect x="1450" y="515" width="200" height="72" rx="8" class="node-surface" />
    <path d="M 1458 516 H 1642" class="node-accent" />
    <text x="1550" y="547" class="node-label" text-anchor="middle">
      <tspan x="1550" dy="0">Memory Maintenance</tspan>
      <tspan x="1550" dy="18">Worker</tspan>
    </text>
  </g>
  <g id="sandbox" class="node sandbox-node">
