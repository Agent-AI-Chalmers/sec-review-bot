  <path d="M 1460 551 L 1380 551 Q 1370 551 1370 541 L 1370 450 Q 1370 440 1360 440 L 940 440 Q 930 440 930 430 L 930 379 Q 930 369 920 369 L 890 369" class="edge dashed" marker-end="url(#arrow)" marker-start="url(#arrow)" />
  <path d="M 1450 265 L 1430 265 Q 1420 265 1420 255 L 1420 240 Q 1420 230 1410 230 L 810 230 Q 800 230 800 240 L 800 315" class="edge dashed" marker-end="url(#arrow)" />
  <path d="M 670 351 L 710 351" class="edge" marker-end="url(#arrow)" />
  <path d="M 670 375 L 675 375 Q 680 375 680 385 L 680 700 Q 680 710 690 710 L 1225 710 Q 1235 710 1235 700 L 1235 672" class="edge" marker-end="url(#arrow)" />
  <path d="M 1010 187 L 1020 205 Q 1030 215 1040 215 L 1320 215 Q 1330 215 1330 225 L 1330 570 Q 1330 580 1320 580 L 1300 580 Q 1290 580 1290 585 L 1290 590" class="edge" marker-end="url(#arrow)" />
  <path d="M 1010 115 L 1010 100 Q 1010 90 1000 90 L 260 90 Q 250 90 250 100 L 250 551 Q 250 561 240 561 L 210 561" class="edge dashed" marker-end="url(#arrow)" />
  <path d="M 1650 301 L 1655 301 Q 1660 301 1660 311 L 1660 745 Q 1660 755 1650 755 L 140 755 Q 130 755 130 745 L 130 607" class="edge dashed" marker-end="url(#arrow)" />
  <path d="M 1650 426 L 1655 426 Q 1660 426 1660 436 L 1660 745 Q 1660 755 1650 755 L 140 755 Q 130 755 130 745 L 130 607" class="edge dashed" marker-end="url(#arrow)" />
  <path d="M 1650 551 L 1655 551 Q 1660 551 1660 561 L 1660 745 Q 1660 755 1650 755 L 140 755 Q 130 755 130 745 L 130 607" class="edge dashed" marker-end="url(#arrow)" />
  <g id="github" class="node external-node">
    <rect x="50" y="115" width="160" height="72" rx="8" class="node-surface" />
    <path d="M 58 116 H 202" class="node-accent" />
    <text x="130" y="156" class="node-label" text-anchor="middle">
      <tspan x="130" dy="0">GitHub</tspan>
    </text>
  </g>
  <g id="langfuse" class="node external-node">
    <rect x="50" y="515" width="160" height="92" rx="8" class="node-surface" />
    <path d="M 58 516 H 202" class="node-accent" />
    <text x="130" y="557" class="node-label" text-anchor="middle">
      <tspan x="130" dy="0">Langfuse</tspan>
      <tspan x="130" dy="18">可观测性</tspan>
    </text>
  </g>
  <g id="browser" class="node external-node">
    <rect x="50" y="315" width="160" height="72" rx="8" class="node-surface" />
    <path d="M 58 316 H 202" class="node-accent" />
    <text x="130" y="347" class="node-label" text-anchor="middle">
      <tspan x="130" dy="0">运维人员</tspan>
      <tspan x="130" dy="18">浏览器</tspan>
    </text>
  </g>
  <g id="tunnel" class="node control-node">
    <rect x="290" y="115" width="160" height="72" rx="8" class="node-surface" />
    <path d="M 298 116 H 442" class="node-accent" />
    <text x="370" y="147" class="node-label" text-anchor="middle">
      <tspan x="370" dy="0">cloudflared</tspan>
      <tspan x="370" dy="18">Cloudflare Tunnel</tspan>
    </text>
  </g>
  <g id="integration" class="node control-node">
    <rect x="710" y="115" width="170" height="72" rx="8" class="node-surface" />
    <path d="M 718 116 H 872" class="node-accent" />
    <text x="795" y="147" class="node-label" text-anchor="middle">
      <tspan x="795" dy="0">GitHub</tspan>
      <tspan x="795" dy="18">Integration</tspan>
    </text>
  </g>
  <g id="review-runs" class="node control-node">
