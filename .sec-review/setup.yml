setup:
  # Python side (agents/). The workspace image ships python3/pip but not uv,
  # which the agents package uses for environment and dependency management.
  - run: pip3 install --no-input uv
    timeout_seconds: 300
  - run: uv sync --frozen
    working-directory: agents
    timeout_seconds: 600

  # Install the JavaScript/TypeScript workspace using the root packageManager.
  - run: npm install --global pnpm@12
    timeout_seconds: 60
  - run: pnpm install --frozen-lockfile
    working-directory: .
    timeout_seconds: 600
