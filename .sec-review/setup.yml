setup:
  # Python side (agents/). The workspace image ships python3/pip but not uv,
  # which the agents package uses for environment and dependency management.
  - run: pip3 install --no-input uv
    timeout_seconds: 300
  - run: uv sync --frozen
    working-directory: agents
    timeout_seconds: 600

  # TypeScript packages. The image ships node and an older pnpm, so activate the
  # repository's pnpm line through corepack before installing committed lockfiles.
  - run: corepack enable
    timeout_seconds: 60
  - run: pnpm install --frozen-lockfile
    working-directory: apps/github-integration
    timeout_seconds: 600
  - run: pnpm install --frozen-lockfile
    working-directory: apps/control-plane-ui
    timeout_seconds: 600
  - run: pnpm install --frozen-lockfile
    working-directory: review-runs
    timeout_seconds: 600
  - run: pnpm install --frozen-lockfile
    working-directory: execution-gateway
    timeout_seconds: 600
  - run: pnpm install --frozen-lockfile
    working-directory: memory-catalog
    timeout_seconds: 600
  - run: pnpm install --frozen-lockfile
    working-directory: contracts/review-runs-api/tools
    timeout_seconds: 600
  - run: pnpm install --frozen-lockfile
    working-directory: contracts/execution-api/tools
    timeout_seconds: 600
  - run: pnpm install --frozen-lockfile
    working-directory: contracts/memory-catalog-api/tools
    timeout_seconds: 600
  - run: pnpm install --frozen-lockfile
    working-directory: contracts/tar-zstd-artifact/envelope/tools
    timeout_seconds: 600
  - run: pnpm install --frozen-lockfile
    working-directory: contracts/tar-zstd-artifact/profiles/input-bundle/tools
    timeout_seconds: 600
  - run: pnpm install --frozen-lockfile
    working-directory: contracts/tar-zstd-artifact/profiles/memory-tree/tools
    timeout_seconds: 600
  - run: pnpm install --frozen-lockfile
    working-directory: contracts/tar-zstd-artifact/profiles/run-diagnostic/tools
    timeout_seconds: 600
