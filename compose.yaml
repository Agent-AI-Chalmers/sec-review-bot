services:
  rustfs:
    image: rustfs/rustfs:1.0.1
    user: "${SEC_REVIEW_SERVICE_UID:-1000}:${SEC_REVIEW_SERVICE_GID:-1000}"
    environment:
      RUSTFS_VOLUMES: "/data"
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: "${RUSTFS_ROOT_USER:-sec-review-root}"
      RUSTFS_SECRET_KEY: "${RUSTFS_ROOT_PASSWORD:?RUSTFS_ROOT_PASSWORD is required}"
      RUSTFS_OBS_LOG_DIRECTORY: "/data/logs"
    volumes:
      - "${PWD}/.agent-rustfs-state:/data"
    ports:
      - "127.0.0.1:${RUSTFS_API_PORT:-9100}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9101}:9001"
  rustfs-init:
    build:
      context: deploy/object-storage
    depends_on:
      rustfs:
        condition: service_started
    environment:
      RUSTFS_ROOT_USER: "${RUSTFS_ROOT_USER:-sec-review-root}"
      RUSTFS_ROOT_PASSWORD: "${RUSTFS_ROOT_PASSWORD:?RUSTFS_ROOT_PASSWORD is required}"
      SEC_REVIEW_ARTIFACT_S3_BUCKET: "sec-review"
      SEC_REVIEW_INTEGRATION_S3_ACCESS_KEY: "${SEC_REVIEW_INTEGRATION_S3_ACCESS_KEY:-sec-review-integration}"
      SEC_REVIEW_INTEGRATION_S3_SECRET_KEY: "${SEC_REVIEW_INTEGRATION_S3_SECRET_KEY:?SEC_REVIEW_INTEGRATION_S3_SECRET_KEY is required}"
      SEC_REVIEW_RUNNER_S3_ACCESS_KEY: "${SEC_REVIEW_RUNNER_S3_ACCESS_KEY:-sec-review-runner}"
      SEC_REVIEW_RUNNER_S3_SECRET_KEY: "${SEC_REVIEW_RUNNER_S3_SECRET_KEY:?SEC_REVIEW_RUNNER_S3_SECRET_KEY is required}"
      SEC_REVIEW_ARTIFACT_PUBLISHER_S3_ACCESS_KEY: "${SEC_REVIEW_ARTIFACT_PUBLISHER_S3_ACCESS_KEY:-sec-review-artifact-publisher}"
      SEC_REVIEW_ARTIFACT_PUBLISHER_S3_SECRET_KEY: "${SEC_REVIEW_ARTIFACT_PUBLISHER_S3_SECRET_KEY:?SEC_REVIEW_ARTIFACT_PUBLISHER_S3_SECRET_KEY is required}"
    volumes:
      - "./deploy/object-storage:/policies:ro"
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-sec_review_bot}"
      POSTGRES_USER: "${POSTGRES_USER:-sec_review_bot}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes:
      - "${PWD}/.agent-postgres-state:/var/lib/postgresql"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  temporal:
    image: temporalio/temporal:latest
    # Match the host service user so the bind-mounted SQLite directory remains
    # writable without making local workflow state world-writable.
    user: "${SEC_REVIEW_SERVICE_UID:-1000}:${SEC_REVIEW_SERVICE_GID:-1000}"
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --db-filename
      - /var/lib/temporal/temporal.db
    volumes:
      # Keep workflow state across the process restarts performed by systemd.
      - "${PWD}/.agent-temporal-state:/var/lib/temporal"
    ports:
      - "127.0.0.1:${TEMPORAL_PORT:-7233}:7233"
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8233}:8233"

  runner-service:
    build:
      context: agents
      dockerfile: Dockerfile
      additional_contexts:
        contracts: contracts
    environment:
      RUNNER_SERVICE_HOST: "0.0.0.0"
      RUNNER_SERVICE_PORT: "8000"
      TEMPORAL_ADDRESS: "temporal:7233"
      TEMPORAL_NAMESPACE: "${TEMPORAL_NAMESPACE:-default}"
      TEMPORAL_TASK_QUEUE: "${TEMPORAL_TASK_QUEUE:-sec-review-agents}"
      # No default token: the runner can spend LLM quota and execute workflows.
      RUNNER_SERVICE_TOKEN: "${RUNNER_SERVICE_TOKEN:?RUNNER_SERVICE_TOKEN is required}"
      TEMPORAL_WORKFLOW_TIMEOUT_SECONDS: "${TEMPORAL_WORKFLOW_TIMEOUT_SECONDS:-10800}"
      SEC_REVIEW_ARTIFACT_S3_BUCKET: "sec-review"
      SEC_REVIEW_ARTIFACT_S3_ENDPOINT: "http://rustfs:9000"
      SEC_REVIEW_AGENT_ARTIFACT_ROOT: "${PWD}/.agent-artifacts"
      AWS_REGION: "us-east-1"
      AWS_ACCESS_KEY_ID: "${SEC_REVIEW_ARTIFACT_PUBLISHER_S3_ACCESS_KEY:-sec-review-artifact-publisher}"
      AWS_SECRET_ACCESS_KEY: "${SEC_REVIEW_ARTIFACT_PUBLISHER_S3_SECRET_KEY:?SEC_REVIEW_ARTIFACT_PUBLISHER_S3_SECRET_KEY is required}"
    volumes:
      # The service reads worker output but owns the only credential that can publish it.
      - "${PWD}/.agent-artifacts:${PWD}/.agent-artifacts:ro"
    ports:
      - "127.0.0.1:${RUNNER_SERVICE_PORT:-8000}:8000"
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
      temporal:
        condition: service_started

  control-plane:
    profiles: ["app"]
    build:
      context: .
      dockerfile: control-plane/Dockerfile
      args:
        NPM_CONFIG_REGISTRY: "${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org}"
    environment:
      CONTROL_PLANE_PORT: "8090"
      CONTROL_PLANE_SERVICE_TOKEN: "${CONTROL_PLANE_SERVICE_TOKEN:?CONTROL_PLANE_SERVICE_TOKEN is required}"
      CONNECTOR_ID: "${CONNECTOR_ID:-github-app:default}"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-sec_review_bot}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-sec_review_bot}"
      AGENT_RUNNER_SERVICE_URL: "http://runner-service:8000"
      AGENT_RUNNER_SERVICE_TOKEN: "${RUNNER_SERVICE_TOKEN:?RUNNER_SERVICE_TOKEN is required}"
      AGENT_RUNNER_BACKGROUND_POLL_INTERVAL_MS: "${AGENT_RUNNER_BACKGROUND_POLL_INTERVAL_MS:-15000}"
    ports:
      - "127.0.0.1:${CONTROL_PLANE_HOST_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      runner-service:
        condition: service_started

  github-integration:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/github-integration/Dockerfile
      args:
        # Override for networks where the public npm registry is unreliable.
        # The default preserves the normal npm registry behavior.
        NPM_CONFIG_REGISTRY: "${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org}"
    env_file:
      - apps/github-integration/.env
    environment:
      PRIVATE_KEY_PATH: "/run/secrets/github-app-private-key.pem"
      CONTROL_PLANE_PUBLICATION_POLL_INTERVAL_MS: "${CONTROL_PLANE_PUBLICATION_POLL_INTERVAL_MS:-15000}"
      CONTROL_PLANE_SERVICE_URL: "http://control-plane:8090"
      CONTROL_PLANE_SERVICE_TOKEN: "${CONTROL_PLANE_SERVICE_TOKEN:?CONTROL_PLANE_SERVICE_TOKEN is required}"
      GITHUB_INTEGRATION_GIT_HTTP_PROXY: "${GITHUB_INTEGRATION_GIT_HTTP_PROXY:-}"
      SEC_REVIEW_ARTIFACT_STORE: "s3"
      SEC_REVIEW_ARTIFACT_S3_BUCKET: "sec-review"
      SEC_REVIEW_ARTIFACT_S3_ENDPOINT: "http://rustfs:9000"
      AWS_REGION: "us-east-1"
      AWS_ACCESS_KEY_ID: "${SEC_REVIEW_INTEGRATION_S3_ACCESS_KEY:-sec-review-integration}"
      AWS_SECRET_ACCESS_KEY: "${SEC_REVIEW_INTEGRATION_S3_SECRET_KEY:?SEC_REVIEW_INTEGRATION_S3_SECRET_KEY is required}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${GITHUB_INTEGRATION_HOST_PORT:-30000}:30000"
    secrets:
      - source: github-app-private-key
        target: github-app-private-key.pem
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
      control-plane:
        condition: service_healthy

secrets:
  github-app-private-key:
    file: ${GITHUB_APP_PRIVATE_KEY_FILE:-./apps/github-integration/private-key.pem}
