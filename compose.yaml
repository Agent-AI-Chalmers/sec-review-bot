services:
  temporal:
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "127.0.0.1:${TEMPORAL_PORT:-7233}:7233"
      - "${TEMPORAL_UI_PORT:-8233}:8233"

  runner-service:
    build:
      context: agents
      dockerfile: Dockerfile
    environment:
      RUNNER_SERVICE_HOST: "0.0.0.0"
      RUNNER_SERVICE_PORT: "8000"
      TEMPORAL_ADDRESS: "temporal:7233"
      TEMPORAL_NAMESPACE: "${TEMPORAL_NAMESPACE:-default}"
      TEMPORAL_TASK_QUEUE: "${TEMPORAL_TASK_QUEUE:-sec-review-agents}"
      # No default token: the runner can spend LLM quota and execute workflows.
      RUNNER_SERVICE_TOKEN: "${RUNNER_SERVICE_TOKEN:?RUNNER_SERVICE_TOKEN is required}"
      TEMPORAL_WORKFLOW_TIMEOUT_SECONDS: "${TEMPORAL_WORKFLOW_TIMEOUT_SECONDS:-10800}"
      SEC_REVIEW_AGENT_INPUT_BUNDLE_ROOT: "${SEC_REVIEW_INPUT_BUNDLE_ROOT:-${PWD}/.agent-input-bundles}"
    ports:
      - "127.0.0.1:${RUNNER_SERVICE_PORT:-8000}:8000"
    depends_on:
      temporal:
        condition: service_started

  github-integration:
    profiles: ["app"]
    build:
      context: apps/github-integration
      dockerfile: Dockerfile
      args:
        # Override for networks where the public npm registry is unreliable.
        # The default preserves the normal npm registry behavior.
        NPM_CONFIG_REGISTRY: "${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org}"
    env_file:
      - apps/github-integration/.env
    environment:
      PRIVATE_KEY_PATH: "/run/secrets/github-app-private-key.pem"
      AGENT_RUNNER_SERVICE_URL: "http://runner-service:8000"
      AGENT_RUNNER_SERVICE_TOKEN: "${RUNNER_SERVICE_TOKEN:?RUNNER_SERVICE_TOKEN is required}"
      AGENT_RUNNER_BACKGROUND_POLL_INTERVAL_MS: "${AGENT_RUNNER_BACKGROUND_POLL_INTERVAL_MS:-15000}"
      SEC_REVIEW_INPUT_BUNDLE_ROOT: "${SEC_REVIEW_INPUT_BUNDLE_ROOT:-${PWD}/.agent-input-bundles}"
      SEC_REVIEW_APP_STATE_ROOT: "${SEC_REVIEW_APP_STATE_ROOT:-${PWD}/.agent-app-state}"
    volumes:
      - "${SEC_REVIEW_INPUT_BUNDLE_ROOT:-${PWD}/.agent-input-bundles}:${SEC_REVIEW_INPUT_BUNDLE_ROOT:-${PWD}/.agent-input-bundles}"
      - "${SEC_REVIEW_APP_STATE_ROOT:-${PWD}/.agent-app-state}:${SEC_REVIEW_APP_STATE_ROOT:-${PWD}/.agent-app-state}"
    ports:
      - "${GITHUB_INTEGRATION_HOST_PORT:-30000}:30000"
    secrets:
      - source: github-app-private-key
        target: github-app-private-key.pem
    depends_on:
      runner-service:
        condition: service_started

secrets:
  github-app-private-key:
    file: ${GITHUB_APP_PRIVATE_KEY_FILE:-./apps/github-integration/private-key.pem}
