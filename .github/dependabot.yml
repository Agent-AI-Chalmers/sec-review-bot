version: 2

updates:
  - package-ecosystem: 'npm'
    cooldown:
      default-days: 7
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '06:00'
      timezone: 'Asia/Shanghai'
    commit-message:
      prefix: 'build(deps)'
      prefix-development: 'build(deps-dev)'
    groups:
      node-workspace:
        patterns:
          - '*'
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: 'uv'
    cooldown:
      default-days: 7
    directory: '/agents'
    schedule:
      interval: 'monthly'
      time: '06:00'
      timezone: 'Asia/Shanghai'
    commit-message:
      prefix: 'build(deps)'
      prefix-development: 'build(deps-dev)'
    groups:
      python-tooling:
        patterns:
          - 'ruff'
          - 'black'
          - 'mypy'
          - 'pyright'
          - 'pytest'
          - 'pytest-asyncio'
      agents-runtime:
        patterns:
          - 'deepagents'
          - 'langchain*'
          - 'langgraph'
          - 'langfuse'
          - 'google-genai'
          - 'anthropic'
          - 'openai'
          - 'mcp'
          - 'temporalio'
          - 'opentelemetry-*'

  - package-ecosystem: 'pip'
    cooldown:
      default-days: 7
    directory: '/ops/rustfs-init'
    schedule:
      interval: 'monthly'
      time: '06:00'
      timezone: 'Asia/Shanghai'
    commit-message:
      prefix: 'build(deps)'
      prefix-development: 'build(deps-dev)'

  - package-ecosystem: 'github-actions'
    cooldown:
      default-days: 7
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '06:00'
      timezone: 'Asia/Shanghai'
    commit-message:
      prefix: 'ci(deps)'
