sec_review_bot:
  # Controls automatic PR / issue webhook review.
  #
  # - manual_only: automatic PR / issue events are ignored;
  #   only explicit comment commands from repository write+ users trigger reviews.
  # - automatic: dangerous mode. PR / issue events from any author trigger
  #   reviews without maintainer approval and can spend runner / LLM resources.
  trigger_mode: manual_only

  # Optional repository discovery ignore patterns (CodeQL-style glob semantics).
  # Examples:
  # - 'frontend/src/assets'
  # - '**/*.min.js'
  # - 'node_modules'
  paths_ignore:
    - '.github/sec-review-bot.yml'
    - '.github/dependabot.yml'
    - 'evaluation'
    - 'scripts/patcheval'
    - 'docs'
    - '**/*.zh.md'
    - '**/README.md'
    - '**/README.zh.md'
    - 'contracts'
    - 'agents/src/sec_review_agents/resources/prompts'
    - 'agents/src/sec_review_agents/resources/skill_source_notes'
    - 'AGENTS.md'
