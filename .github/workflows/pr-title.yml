name: PR Title

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
  # Required checks must also report on merge queue candidates. The pull request
  # title was already validated before the candidate entered the queue.
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

jobs:
  title:
    name: PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7

      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 .github/ci/validate-pr-title.py

      - name: Preserve the required check in the merge queue
        if: github.event_name == 'merge_group'
        run: echo "The pull request title was validated before entering the merge queue."
