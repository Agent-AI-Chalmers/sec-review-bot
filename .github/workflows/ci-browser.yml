name: Control Plane UI E2E

on:
  workflow_call:

permissions:
  contents: read

jobs:
  control-plane-ui-browser:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-plane-ui
    strategy:
      fail-fast: false
      matrix:
        project:
          - desktop
          - mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node package
        uses: ./.github/actions/setup-node
        with:
          directory: apps/control-plane-ui

      - name: Browser project
        run: pnpm exec playwright test --project=${{ matrix.project }}

      # The runner workspace disappears after the job. Preserve Playwright's
      # report, error context, traces, and screenshots only when diagnosis is needed.
      - name: Upload browser diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: control-plane-ui-${{ matrix.project }}-playwright
          path: |
            apps/control-plane-ui/playwright-report/
            apps/control-plane-ui/test-results/
          retention-days: 14
          if-no-files-found: warn
