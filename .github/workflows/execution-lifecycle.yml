name: Smoke — Execution Lifecycle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    name: Model-free execution lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
      - uses: ./.github/actions/setup-node
        with:
          directory: services/execution-gateway
      - name: Build participants
        shell: bash
        run: |
          for package in services/execution-gateway services/review-runs apps/github-integration; do
            pnpm --dir "$package" run build
          done
      - name: Test execution, retry, diagnostics and durable terminal state
        run: uv --project agents run python -m pytest scripts/system-tests/test_execution_lifecycle.py -q --durations=10
