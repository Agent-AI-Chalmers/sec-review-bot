name: Package Checks with PostgreSQL

on:
  workflow_call:
    inputs:
      directory:
        description: Package directory relative to the repository root.
        required: true
        type: string
      database:
        description: Disposable PostgreSQL database name.
        required: true
        type: string
      user:
        description: PostgreSQL role used by the package tests.
        required: true
        type: string

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: ${{ inputs.database }}
          POSTGRES_USER: ${{ inputs.user }}
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ${{ inputs.user }} -d ${{ inputs.database }}"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: ${{ inputs.directory }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node package
        uses: ./.github/actions/setup-node
        with:
          directory: ${{ inputs.directory }}

      - name: Check
        run: |
          pnpm run format:check
          pnpm run lint
          pnpm run typecheck
          pnpm test

      - name: Integration test
        env:
          TEST_DATABASE_URL: postgresql://${{ inputs.user }}:ci-test-password@127.0.0.1:5432/${{ inputs.database }}
        run: pnpm run test:integration
