name: CI

on:
  workflow_dispatch:
  # Give contributors fast feedback before a change enters the merge queue.
  pull_request:
  # Merge queue candidates must report the same required CI Status check as PRs.
  # Re-test the exact candidate GitHub intends to merge against the latest main.
  # A separate push-to-main run is intentionally omitted because merge_group has
  # already tested that commit; post-merge deploy/release work belongs elsewhere.
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      automation-config: ${{ steps.filter.outputs.automation-config }}
      ops: ${{ steps.filter.outputs.ops }}
      contract-tools: ${{ steps.filter.outputs.contract-tools }}
      review-runs: ${{ steps.filter.outputs.review-runs }}
      execution-gateway: ${{ steps.filter.outputs.execution-gateway }}
      system-tests: ${{ steps.filter.outputs.system-tests }}
      memory-catalog: ${{ steps.filter.outputs.memory-catalog }}
      github-integration: ${{ steps.filter.outputs.github-integration }}
      control-plane-ui: ${{ steps.filter.outputs.control-plane-ui }}
      agents: ${{ steps.filter.outputs.agents }}
      scripts: ${{ steps.filter.outputs.scripts }}
      documentation: ${{ steps.filter.outputs.documentation }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: .github/ci/changed-areas.yml
  automation-config:
    name: Automation Config
    needs: changes
    if: >-
      github.event_name == 'merge_group' ||
      needs.changes.outputs.automation-config == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # actionlint catches invalid expressions, job dependencies, event syntax,
      # and other GitHub Actions mistakes that ordinary project tests cannot see.
      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@v2

      # Dependabot has no equivalent local semantic validator, but parsing the
      # file still prevents malformed YAML from reaching the default branch.
      - name: Parse Dependabot configuration
        run: ruby -e 'require "yaml"; YAML.parse_file(".github/dependabot.yml")'

      # Every CI job must contribute to the required aggregate check.
      - name: Check CI Status dependency coverage
        run: |
          ruby -ryaml -e '
            jobs = YAML.load_file(".github/workflows/ci.yml").fetch("jobs")
            expected = jobs.keys - ["ci-status"]
            actual = jobs.fetch("ci-status").fetch("needs")
            missing = expected - actual
            extra = actual - expected
            abort "CI Status dependencies differ: missing=#{missing.inspect}, extra=#{extra.inspect}" unless missing.empty? && extra.empty?
          '

      - name: Check trusted review setup package coverage
        run: |
          ruby -ryaml -e '
            setup = YAML.safe_load_file(".sec-review/setup.yml").fetch("setup")
            actual = setup.filter_map do |step|
              step["working-directory"] if step["run"] == "pnpm install --frozen-lockfile"
            end.sort
            expected = IO.popen(["git", "ls-files", "*/pnpm-lock.yaml"], &:read).lines.map {
              File.dirname(_1.strip)
            }.sort
            message = "setup pnpm directories differ:\nexpected=" + expected.inspect + "\nactual=" + actual.inspect
            abort message unless actual == expected
          '

      # The changed-area model (`.github/ci/changed-areas.yml`) is the single source of the
      # `changes` job's filters. This checks the couplings CI cannot see in an import graph: that
      # a job and its filter still agree, that every generated artifact and every tracked file is
      # covered — the coupling that, when missing, lets a change run no job at all.
      - name: Check changed-area model
        run: python3 .github/ci/check-changed-areas.py

  ops:
    name: Ops
    needs: changes
    if: >-
      github.event_name == 'merge_group' ||
      needs.changes.outputs.ops == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # ops/ and the root Compose files sit outside every app suite; validate them
      # cheaply so a change there cannot land with CI Status green but untested.
      # install.sh is `#!/bin/sh`, so check it with the POSIX shell (dash on the
      # runner), not bash — bash is a superset and would accept syntax dash rejects.
      - name: Check systemd scripts
        run: |
          sh -n ops/systemd/install.sh
          sh -n ops/systemd/test-filter-environment.sh
          sh ops/systemd/test-filter-environment.sh

      - name: Compile the RustFS init script
        run: python3 -m py_compile ops/rustfs-init/init.py

      - name: Validate the Compose file
        # --no-interpolate: CI has no `.env` (it is gitignored) and the `:?`
        # interpolations require real secrets, so interpolating would always fail.
        # We validate the compose structure, not the operator's secret values.
        run: docker compose -f compose.yaml config -q --no-interpolate

  contract-tools:
    name: Contract Tools (${{ matrix.name }})
    needs: changes
    if: >-
      github.event_name == 'merge_group' ||
      needs.changes.outputs.contract-tools == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: review-runs-api
            tools_directory: contracts/review-runs-api/tools
          - name: execution-api
            tools_directory: contracts/execution-api/tools
          - name: memory-catalog-api
            tools_directory: contracts/memory-catalog-api/tools
          - name: tar-zstd-envelope
            tools_directory: contracts/tar-zstd-artifact/envelope/tools
          - name: memory-tree-profile
            tools_directory: contracts/tar-zstd-artifact/profiles/memory-tree/tools
          - name: input-bundle-profile
            tools_directory: contracts/tar-zstd-artifact/profiles/input-bundle/tools
          - name: run-diagnostic-profile
            tools_directory: contracts/tar-zstd-artifact/profiles/run-diagnostic/tools
    defaults:
      run:
        working-directory: ${{ matrix.tools_directory }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node package
        uses: ./.github/actions/setup-node
        with:
          directory: ${{ matrix.tools_directory }}

      - name: Check generated artifacts are fresh
        # Re-renders this family's projections and compares them to the committed files. It
        # also runs inside `pnpm test`, but as its own step so a failure reads as one check.
        run: pnpm run check

      - name: Check
        run: |
          pnpm --if-present run format:check
          pnpm --if-present run lint
          pnpm --if-present run lint:contract
          pnpm --if-present run typecheck
          pnpm test

  review-runs:
    name: Review Runs
    needs: changes
    if: >-
      github.event_name == 'merge_group' ||
      needs.changes.outputs.review-runs == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: sec_review_bot_test
          POSTGRES_USER: sec_review_bot
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sec_review_bot -d sec_review_bot_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: services/review-runs
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node package
        uses: ./.github/actions/setup-node
        with:
          directory: services/review-runs

      - name: Check
        run: |
          pnpm run format:check
          pnpm run lint
          pnpm run typecheck
          pnpm test

      - name: Integration test
        env:
          TEST_DATABASE_URL: postgresql://sec_review_bot:ci-test-password@127.0.0.1:5432/sec_review_bot_test
        run: pnpm run test:integration

  execution-gateway:
    name: Execution Gateway
    needs: changes
    if: >-
      github.event_name == 'merge_group' ||
      needs.changes.outputs.execution-gateway == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/execution-gateway
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node package
        uses: ./.github/actions/setup-node
        with:
          directory: services/execution-gateway

      - name: Check
        run: |
          pnpm run format:check
          pnpm run lint
          pnpm run typecheck
          pnpm test

      - name: Integration test
        run: pnpm run test:integration

  execution-submission-system:
    name: Execution Submission System Test
    needs: changes
    if: >-
      github.event_name == 'merge_group' ||
      needs.changes.outputs.system-tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node package
        uses: ./.github/actions/setup-node
        with:
          directory: services/execution-gateway
          cache-dependency-path: |
            services/execution-gateway/pnpm-lock.yaml
            services/review-runs/pnpm-lock.yaml

      - name: Install Review Runs dependencies
        working-directory: services/review-runs
        run: pnpm install --frozen-lockfile

      - name: Test execution submission boundary
        run: node --test scripts/system-tests/execution-submission.test.mjs

  memory-catalog:
    name: Memory Catalog
    needs: changes
    if: >-
      github.event_name == 'merge_group' ||
      needs.changes.outputs.memory-catalog == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: memory_catalog_test
          POSTGRES_USER: memory_catalog
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memory_catalog -d memory_catalog_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: services/memory-catalog
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node package
        uses: ./.github/actions/setup-node
        with:
          directory: services/memory-catalog

      - name: Check
        run: |
          pnpm run format:check
          pnpm run lint
          pnpm run typecheck
          pnpm test

      - name: Integration test
        env:
          TEST_DATABASE_URL: postgresql://memory_catalog:ci-test-password@127.0.0.1:5432/memory_catalog_test
        run: pnpm run test:integration

  github-integration:
    name: GitHub Integration
    needs: changes
    if: >-
      github.event_name == 'merge_group' ||
      needs.changes.outputs.github-integration == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/github-integration
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node package
        uses: ./.github/actions/setup-node
        with:
          directory: apps/github-integration

      - name: Lint
        run: |
          pnpm run format:check
          pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test
      # Deliberately no `test:integration` step. The only integration test here is the opt-in S3
      # upload check, which self-skips without `SEC_REVIEW_TEST_S3_ENDPOINT`, so a CI step would
      # pass vacuously. The integration↔review-runs boundary is covered by Review Runs's own
      # integration suite (real PostgreSQL store) and by
      # `services/review-runs/test/integration/client-server-seam.test.ts`, which drives this package's
      # real client against the real server; both jobs provision what they need.

  control-plane-ui:
    name: Control Plane UI
    needs: changes
    if: >-
      github.event_name == 'merge_group' ||
      needs.changes.outputs.control-plane-ui == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-plane-ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node package
        uses: ./.github/actions/setup-node
        with:
          directory: apps/control-plane-ui

      - name: Check
        run: |
          pnpm run format:check
          pnpm run lint
          pnpm run typecheck
          pnpm run colors:check
          pnpm run icons:check
          pnpm run styles:report
          pnpm test
          pnpm run build

  control-plane-ui-browser:
    name: Control Plane UI browser (${{ matrix.project }})
    needs: changes
    if: >-
      github.event_name == 'merge_group' ||
      needs.changes.outputs.control-plane-ui == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-plane-ui
    strategy:
      fail-fast: false
      matrix:
        project:
          - desktop
          - mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node package
        uses: ./.github/actions/setup-node
        with:
          directory: apps/control-plane-ui

      - name: Browser project
        run: pnpm exec playwright test --project=${{ matrix.project }}

      # The runner workspace disappears after the job. Preserve Playwright's
      # report, error context, traces, and screenshots only when diagnosis is needed.
      - name: Upload browser diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: control-plane-ui-${{ matrix.project }}-playwright
          path: |
            apps/control-plane-ui/playwright-report/
            apps/control-plane-ui/test-results/
          retention-days: 14
          if-no-files-found: warn

  agents:
    name: Agents
    needs: changes
    if: >-
      github.event_name == 'merge_group' ||
      needs.changes.outputs.agents == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version-file: agents/.python-version

      - name: Set up uv
        # setup-uv intentionally uses immutable releases and does not publish
        # floating major/minor tags; pin the action while the uv CLI tracks latest.
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: agents/uv.lock

      - name: Install dependencies
        run: uv sync --group dev --frozen

      # mypy's cache is safe to restore across commits: mypy validates cached
      # metadata against the current source and dependencies before reusing it.
      # Include the commit in the exact key so successful runs can publish a
      # fresh cache; the restore prefix finds the newest compatible prior run.
      - name: Restore mypy cache
        uses: actions/cache@v6
        with:
          path: agents/.mypy_cache
          key: >-
            mypy-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('agents/uv.lock', 'agents/pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('agents/uv.lock', 'agents/pyproject.toml') }}-

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Check formatting with Black
        run: uv run black --check .

      - name: Type-check with mypy
        run: uv run mypy .

      - name: Type-check with Pyright
        run: uv run pyright .

      - name: Test
        # Report every setup/call/teardown phase taking at least 10 ms. This is
        # diagnostic only: it does not select, skip, reorder, or relax tests.
        run: uv run python -m pytest --durations=0 --durations-min=0.01

  scripts:
    name: Repository Scripts
    needs: changes
    if: >-
      github.event_name == 'merge_group' ||
      needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: agents/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: agents/uv.lock

      - name: Install dependencies
        working-directory: agents
        run: uv sync --group dev --frozen

      # Scripts are repository tools rather than part of the typed agents
      # package, but they still depend on the agents runtime and its deps.
      - name: Lint repository scripts with Ruff
        working-directory: scripts
        run: uv --project ../agents run ruff check .

      - name: Check repository script formatting with Black
        working-directory: scripts
        run: uv --project ../agents run black --check .

      - name: Compile repository scripts
        working-directory: scripts
        run: python -m compileall -q .

      - name: Smoke-test repository script entrypoints
        working-directory: scripts
        env:
          PYTHONPATH: ../agents/src
        run: |
          uv --project ../agents run python experimental_memory_extract_observations.py --help

  documentation:
    name: Documentation
    needs: changes
    if: >-
      github.event_name == 'merge_group' ||
      needs.changes.outputs.documentation == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: agents/.python-version

      - name: Check Markdown links
        run: python scripts/check_markdown_links.py

      - name: Check Markdown wrapping
        run: python scripts/check_markdown_wrapping.py

      - name: Check translated document headings
        run: python scripts/check_translated_doc_headings.py

  ci-status:
    name: CI Status
    needs:
      - changes
      - automation-config
      - ops
      - contract-tools
      - review-runs
      - execution-gateway
      - execution-submission-system
      - memory-catalog
      - github-integration
      - control-plane-ui
      - control-plane-ui-browser
      - agents
      - scripts
      - documentation
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Use this aggregate job as the required branch-protection check.
      - name: Check CI result
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import sys

          # Include change detection: its failure can skip every area job.
          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = {
              job: details["result"]
              for job, details in needs.items()
              if details["result"] not in {"success", "skipped"}
          }
          for job, result in failed.items():
              print(f"{job}: {result}", file=sys.stderr)
          sys.exit(1 if failed else 0)
          PYTHON
