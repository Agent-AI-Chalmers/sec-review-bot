name: CI

on:
  workflow_dispatch:
  # Give contributors fast feedback before a change enters the merge queue.
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "assets/**"
  # Merge queue candidates must report the same required CI Status check as PRs.
  # Re-test the exact candidate GitHub intends to merge against the latest main.
  # A separate push-to-main run is intentionally omitted because merge_group has
  # already tested that commit; post-merge deploy/release work belongs elsewhere.
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      github-integration: ${{ steps.filter.outputs.github-integration }}
      agents: ${{ steps.filter.outputs.agents }}
      automation-config: ${{ steps.filter.outputs.automation-config }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            github-integration:
              - 'apps/github-integration/**'
              - '.github/workflows/ci.yml'
            agents:
              - 'agents/**'
              - '.github/workflows/ci.yml'
            # Automation configuration has its own lightweight validation. A
            # Dependabot scheduling change should not run both application suites.
            automation-config:
              - '.github/dependabot.yml'
              - '.github/workflows/**'

  automation-config:
    name: Automation Config
    needs: changes
    if: >-
      github.event_name == 'merge_group' ||
      needs.changes.outputs.automation-config == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # actionlint catches invalid expressions, job dependencies, event syntax,
      # and other GitHub Actions mistakes that ordinary project tests cannot see.
      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@v2

      # Dependabot has no equivalent local semantic validator, but parsing the
      # file still prevents malformed YAML from reaching the default branch.
      - name: Parse Dependabot configuration
        run: ruby -e 'require "yaml"; YAML.parse_file(".github/dependabot.yml")'

  github-integration:
    name: GitHub Integration
    needs: changes
    if: >-
      github.event_name == 'merge_group' ||
      needs.changes.outputs.github-integration == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/github-integration
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/github-integration/package.json
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: apps/github-integration/package.json
          check-latest: true
          cache: pnpm
          cache-dependency-path: apps/github-integration/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

  agents:
    name: Agents
    needs: changes
    if: >-
      github.event_name == 'merge_group' ||
      needs.changes.outputs.agents == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version-file: agents/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.10.9"
          enable-cache: true
          cache-dependency-glob: agents/uv.lock

      - name: Install dependencies
        run: uv sync --group dev --frozen

      # mypy's cache is safe to restore across commits: mypy validates cached
      # metadata against the current source and dependencies before reusing it.
      # Include the commit in the exact key so successful runs can publish a
      # fresh cache; the restore prefix finds the newest compatible prior run.
      - name: Restore mypy cache
        uses: actions/cache@v6
        with:
          path: agents/.mypy_cache
          key: >-
            mypy-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('agents/uv.lock', 'agents/pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('agents/uv.lock', 'agents/pyproject.toml') }}-

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Check formatting with Black
        run: uv run black --check .

      - name: Type-check with mypy
        run: uv run mypy .

      - name: Type-check with Pyright
        run: uv run pyright .

      - name: Test
        # Report every setup/call/teardown phase taking at least 10 ms. This is
        # diagnostic only: it does not select, skip, reorder, or relax tests.
        run: uv run python -m pytest --durations=0 --durations-min=0.01

  ci-status:
    name: CI Status
    needs:
      - changes
      - automation-config
      - github-integration
      - agents
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Use this aggregate job as the required branch-protection check.
      - name: Check CI result
        env:
          AUTOMATION_CONFIG_RESULT: ${{ needs.automation-config.result }}
          GITHUB_INTEGRATION_RESULT: ${{ needs.github-integration.result }}
          AGENTS_RESULT: ${{ needs.agents.result }}
        run: |
          set -euo pipefail
          for result in \
            "$AUTOMATION_CONFIG_RESULT" \
            "$GITHUB_INTEGRATION_RESULT" \
            "$AGENTS_RESULT"; do
            case "$result" in
              success|skipped)
                ;;
              *)
                echo "A required CI job did not pass. Result: $result" >&2
                exit 1
                ;;
            esac
          done
