name: CI

on:
  workflow_dispatch:
  # Give contributors fast feedback before a change enters the merge queue.
  pull_request:
  # Merge queue candidates must report the same required CI Status check as PRs.
  # Re-test the exact candidate GitHub intends to merge against the latest main.
  # A separate push-to-main run is intentionally omitted because merge_group has
  # already tested that commit; post-merge deploy/release work belongs elsewhere.
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # dorny/paths-filter lists pull request files through the API.
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      automation-config: ${{ steps.filter.outputs.automation-config }}
      catalog-seam: ${{ steps.filter.outputs.catalog-seam }}
      input-bundle-seam: ${{ steps.filter.outputs.input-bundle-seam }}
      memory-bff-seam: ${{ steps.filter.outputs.memory-bff-seam }}
      ops: ${{ steps.filter.outputs.ops }}
      contract-tools: ${{ steps.filter.outputs.contract-tools }}
      review-runs: ${{ steps.filter.outputs.review-runs }}
      execution-gateway: ${{ steps.filter.outputs.execution-gateway }}
      system-tests: ${{ steps.filter.outputs.system-tests }}
      memory-catalog: ${{ steps.filter.outputs.memory-catalog }}
      github-integration: ${{ steps.filter.outputs.github-integration }}
      control-plane-ui: ${{ steps.filter.outputs.control-plane-ui }}
      agents: ${{ steps.filter.outputs.agents }}
      scripts: ${{ steps.filter.outputs.scripts }}
      documentation: ${{ steps.filter.outputs.documentation }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: .github/ci/changed-areas.yml

  automation-config:
    name: Automation Config
    needs: changes
    if: >-
      github.event_name == 'merge_group' ||
      needs.changes.outputs.automation-config == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # actionlint catches invalid expressions, job dependencies, event syntax,
      # and other GitHub Actions mistakes that ordinary project tests cannot see.
      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@v2
      # Dependabot has no equivalent local semantic validator, but parsing the
      # file still prevents malformed YAML from reaching the default branch.
      - name: Parse Dependabot configuration
        run: ruby -e 'require "yaml"; YAML.parse_file(".github/dependabot.yml")'

      # Every CI job must contribute to the required aggregate check.
      - name: Check CI Status dependency coverage
        run: ruby .github/ci/check-ci-status-dependencies.rb

      - name: Check trusted review setup package coverage
        run: ruby .github/ci/check-review-setup.rb

      # The changed-area model (`.github/ci/changed-areas.yml`) is the single source of the
      # `changes` job's filters. This checks the couplings CI cannot see in an import graph: that
      # a job and its filter still agree, that every generated artifact and every tracked file is
      # covered — the coupling that, when missing, lets a change run no job at all.
      - name: Check changed-area model
        run: python3 .github/ci/check-changed-areas.py

      - name: Test CI aggregation
        run: python3 .github/ci/test_ci.py

  ops:
    name: Ops
    needs: changes
    if: >-
      github.event_name == 'merge_group' ||
      needs.changes.outputs.ops == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # ops/ and the root Compose files sit outside every app suite; validate them
      # cheaply so a change there cannot land with CI Status green but untested.
      # install.sh is `#!/bin/sh`, so check it with the POSIX shell (dash on the
      # runner), not bash — bash is a superset and would accept syntax dash rejects.
      - name: Check systemd scripts
        run: |
          sh -n ops/systemd/install.sh
          sh -n ops/systemd/test-filter-environment.sh
          sh ops/systemd/test-filter-environment.sh

      - name: Compile the RustFS init script
        run: python3 -m py_compile ops/rustfs-init/init.py

      - name: Validate the Compose file
        # --no-interpolate: CI has no `.env` (it is gitignored) and the `:?`
        # interpolations require real secrets, so interpolating would always fail.
        # We validate the compose structure, not the operator's secret values.
        run: docker compose -f compose.yaml config -q --no-interpolate

  contract-tools:
    name: Contract Tools
    needs: changes
    if: >-
      github.event_name == 'merge_group' ||
      needs.changes.outputs.contract-tools == 'true'
    uses: ./.github/workflows/ci-contracts.yml

  review-runs:
    name: Review Runs
    needs: changes
    if: >-
      github.event_name == 'merge_group' ||
      needs.changes.outputs.review-runs == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: sec_review_bot_test
          POSTGRES_USER: sec_review_bot
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sec_review_bot -d sec_review_bot_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: services/review-runs
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node package
        uses: ./.github/actions/setup-node
        with:
          directory: services/review-runs

      - name: Check
        run: |
          pnpm run format:check
          pnpm run lint
          pnpm run typecheck
          pnpm test

      - name: Integration test
        env:
          TEST_DATABASE_URL: postgresql://sec_review_bot:ci-test-password@127.0.0.1:5432/sec_review_bot_test
        run: pnpm run test:integration

  memory-catalog:
    name: Memory Catalog
    needs: changes
    if: >-
      github.event_name == 'merge_group' ||
      needs.changes.outputs.memory-catalog == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: memory_catalog_test
          POSTGRES_USER: memory_catalog
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memory_catalog -d memory_catalog_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: services/memory-catalog
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node package
        uses: ./.github/actions/setup-node
        with:
          directory: services/memory-catalog

      - name: Check
        run: |
          pnpm run format:check
          pnpm run lint
          pnpm run typecheck
          pnpm test

      - name: Integration test
        env:
          TEST_DATABASE_URL: postgresql://memory_catalog:ci-test-password@127.0.0.1:5432/memory_catalog_test
        run: pnpm run test:integration

  execution-gateway:
    name: Execution Gateway
    needs: changes
    if: >-
      github.event_name == 'merge_group' ||
      needs.changes.outputs.execution-gateway == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/execution-gateway
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node package
        uses: ./.github/actions/setup-node
        with:
          directory: services/execution-gateway

      - name: Check
        run: |
          pnpm run format:check
          pnpm run lint
          pnpm run typecheck
          pnpm test

      - name: Integration test
        run: pnpm run test:integration

  memory-artifact-smoke:
    name: Smoke — Memory and Artifacts
    needs: changes
    if: >-
      github.event_name == 'merge_group' ||
      needs.changes.outputs.catalog-seam == 'true' ||
      needs.changes.outputs.input-bundle-seam == 'true' ||
      needs.changes.outputs.memory-bff-seam == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-seams
        with:
          catalog: ${{ github.event_name == 'merge_group' || needs.changes.outputs.catalog-seam == 'true' }}
          input-bundle: ${{ github.event_name == 'merge_group' || needs.changes.outputs.input-bundle-seam == 'true' }}
          memory-bff: ${{ github.event_name == 'merge_group' || needs.changes.outputs.memory-bff-seam == 'true' }}

  execution-submission-system:
    name: Smoke — Service Boundaries
    needs: changes
    if: >-
      github.event_name == 'merge_group' ||
      needs.changes.outputs.system-tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node package
        uses: ./.github/actions/setup-node
        with:
          directory: services/execution-gateway

      - name: Test Integration client against Review Runs HTTP
        run: |
          pnpm --dir apps/github-integration run build
          pnpm --dir services/review-runs run build
          node --test system-tests/review-runs-http/review-runs-http.test.mjs

      - name: Test execution submission boundary
        run: node --test system-tests/execution-submission/execution-submission.test.mjs

  github-integration:
    name: GitHub Integration
    needs: changes
    if: >-
      github.event_name == 'merge_group' ||
      needs.changes.outputs.github-integration == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/github-integration
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node package
        uses: ./.github/actions/setup-node
        with:
          directory: apps/github-integration

      - name: Lint
        run: |
          pnpm run format:check
          pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test
      # Deliberately no `test:integration` step. The only integration test here is the opt-in S3
      # upload check, which self-skips without `SEC_REVIEW_TEST_S3_ENDPOINT`, so a CI step would
      # pass vacuously. The Integration-to-Review-Runs HTTP boundary is covered by the
      # repository-level review-runs-http test in Smoke — Service Boundaries.

  control-plane-ui:
    name: Control Plane UI
    needs: changes
    if: >-
      github.event_name == 'merge_group' ||
      needs.changes.outputs.control-plane-ui == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-plane-ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node package
        uses: ./.github/actions/setup-node
        with:
          directory: apps/control-plane-ui

      - name: Check
        run: |
          pnpm run format:check
          pnpm run lint
          pnpm run typecheck
          pnpm run colors:check
          pnpm run icons:check
          pnpm run styles:report
          pnpm test
          pnpm run build

  control-plane-ui-browser:
    name: Control Plane UI E2E
    needs: changes
    if: >-
      github.event_name == 'merge_group' ||
      needs.changes.outputs.control-plane-ui == 'true'
    uses: ./.github/workflows/ci-browser.yml

  agents:
    name: Agents
    needs: changes
    if: >-
      github.event_name == 'merge_group' ||
      needs.changes.outputs.agents == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check agents
        uses: ./.github/actions/check-agents

  scripts:
    name: Scripts and System Test Tooling
    needs: changes
    if: >-
      github.event_name == 'merge_group' ||
      needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python environment
        id: setup-python
        uses: ./.github/actions/setup-python

      # Repository scripts and system tests share the agents runtime dependencies
      # for static checks; system test execution stays in the boundary jobs.
      - name: Lint scripts and system tests with Ruff
        working-directory: scripts
        run: uv --project ../agents run ruff check . ../system-tests

      - name: Check script and system test formatting with Black
        working-directory: scripts
        run: uv --project ../agents run black --check . ../system-tests

      - name: Compile scripts and system tests
        working-directory: scripts
        run: python -m compileall -q . ../system-tests

      - name: Test repository scripts
        run: uv --project agents run python -m pytest scripts/tests

  documentation:
    name: Documentation
    needs: changes
    if: >-
      github.event_name == 'merge_group' ||
      needs.changes.outputs.documentation == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: agents/.python-version

      - name: Check Markdown links
        run: python -m scripts.checks.markdown_links

      - name: Check Markdown wrapping
        run: python -m scripts.checks.markdown_wrapping

      - name: Check translated document structure and examples
        run: python -m scripts.checks.translated_doc_headings

      - name: Set up Node package
        uses: ./.github/actions/setup-node
        with:
          directory: .

      - name: Lint Markdown
        run: pnpm run lint:md

      - name: Check repository-level formatting
        run: pnpm run format:root:check

      - name: Check Chinese documentation spacing and punctuation
        run: pnpm run lint:zh

  ci-status:
    name: CI Status
    needs:
      - changes
      - automation-config
      - ops
      - contract-tools
      - review-runs
      - memory-catalog
      - execution-gateway
      - execution-submission-system
      - memory-artifact-smoke
      - github-integration
      - control-plane-ui
      - control-plane-ui-browser
      - agents
      - scripts
      - documentation
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Use this aggregate job as the required branch-protection check.
      - name: Check CI result
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import sys

          # Include change detection: its failure can skip every area job.
          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = {
              job: details["result"]
              for job, details in needs.items()
              if details["result"] not in {"success", "skipped"}
          }
          for job, result in failed.items():
              print(f"{job}: {result}", file=sys.stderr)
          sys.exit(1 if failed else 0)
          PYTHON
