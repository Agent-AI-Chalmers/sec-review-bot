name: PR Description

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
  # Required checks must also report on merge queue candidates. The pull request
  # description was already validated before the candidate entered the queue.
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

jobs:
  description:
    name: PR Description
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7

      - name: Validate pull request description
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python3 .github/ci/validate-pr-description.py

      - name: Preserve the required check in the merge queue
        if: github.event_name == 'merge_group'
        run: echo "The pull request description was validated before entering the merge queue."
