# The changed-area filter set `dorny/paths-filter` reads (see ci.yml, `Detect changed areas`).
#
# This file is the single source of truth for which changes run which jobs: each top-level key
# is an area a job gates on (`needs.changes.outputs.<area>`), and the globs under it select the
# area. It is read directly — there is no generator — and `check-changed-areas.py` guards it.
#
# Every glob that belongs to an area that reads the shared contract, or that can affect how a
# job runs, is listed under that area too: CI cannot see those couplings in an import graph, so
# they are written down here. The validator checks them (and that every tracked file is covered
# by an area or is an acknowledged exception).
#
# Comments are free-form; the validator reads only the area keys and their globs.

automation-config:
  - '.oxlintrc.json'
  - 'package.json'
  - 'pnpm-workspace.yaml'
  - '.dockerignore'
  - 'pnpm-lock.yaml'
  - '.github/actions/check-agents/**'
  - '.github/actions/setup-python/**'
  - '.github/actions/setup-node/**'
  # Dependabot configuration and the workflow definitions themselves.
  - '.github/dependabot.yml'
  - '.github/workflows/**'
  # Repository-wide editor defaults used by maintainers and agents.
  - '.editorconfig'
  # The changed-area model and its validator.
  - '.github/ci/**'
  # The trusted review setup is executable repository automation.
  - '.sec-review/**'

ops:
  # Deployment scripts, Compose topology, and deployment smoke tooling.
  - '.oxlintrc.json'
  - 'package.json'
  - 'pnpm-workspace.yaml'
  - 'pnpm-lock.yaml'
  - '.github/actions/setup-node/**'
  - 'ops/**'
  - 'compose.yaml'
  - 'smoke-tests/**'
  - 'compose.env.sample'
  - 'compose.memory.env.sample'
  # A CI change can affect how ops is validated.
  - '.github/workflows/ci.yml'

contract-tools:
  # Generated projections use the destination package's formatter configuration.
  - '.oxfmtrc.json'
  - 'apps/*/.oxfmtrc.json'
  - 'services/*/.oxfmtrc.json'
  - '.oxlintrc.json'
  - 'package.json'
  - 'pnpm-workspace.yaml'
  - '.dockerignore'
  - 'pnpm-lock.yaml'
  - '.github/workflows/ci-contracts.yml'
  - '.github/actions/setup-node/**'
  # The per-family tools and the contract trees they own.
  - 'contracts/**'
  # Every projection a contract tool renders into another package. The validator derives this
  # set from the tools' generated-artifacts.json manifests, so a new projection cannot be added
  # without wiring it here.
  - 'services/review-runs/src/contract-types.generated.ts'
  - 'services/review-runs/src/error-codes.generated.ts'
  - 'services/review-runs/src/execution-api-types.generated.ts'
  - 'apps/github-integration/src/review-runs/review-runs-api.generated.ts'
  - 'apps/control-plane-ui/shared/list-run-query-params.ts'
  - 'apps/control-plane-ui/browser/features/runs/api-types.generated.ts'
  - 'apps/control-plane-ui/browser/features/runs/state-machines.generated.ts'
  - 'services/review-runs/src/state-machines.generated.ts'
  - 'apps/github-integration/src/execution/execution-api-types.generated.ts'
  - 'apps/github-integration/src/execution/execution-api-version.ts'
  - 'services/execution-gateway/src/execution-api-types.generated.ts'
  - 'services/execution-gateway/src/execution-api-version.ts'
  - 'services/memory-catalog/src/contract-types.generated.ts'
  - 'apps/control-plane-ui/browser/features/memory/api-types.generated.ts'
  # CI tooling.
  - '.github/ci/**'
  - '.github/workflows/ci.yml'

review-runs:
  - '.oxlintrc.json'
  - 'package.json'
  - 'pnpm-workspace.yaml'
  - '.dockerignore'
  - 'pnpm-lock.yaml'
  - '.github/actions/setup-node/**'
  - 'services/review-runs/**'
  # It validates requests against the shared contract schemas.
  - 'contracts/**'
  # CI tooling.
  - '.github/ci/**'
  - '.github/workflows/ci.yml'

execution-gateway:
  - '.oxlintrc.json'
  - 'package.json'
  - 'pnpm-workspace.yaml'
  - '.dockerignore'
  - 'pnpm-lock.yaml'
  - '.github/actions/setup-node/**'
  - 'services/execution-gateway/**'
  - 'contracts/execution-api/**'
  - 'contracts/codegen/**'
  - 'contracts/execution-workflow/**'
  - '.github/workflows/ci.yml'

memory-catalog:
  - '.oxlintrc.json'
  - 'package.json'
  - 'pnpm-workspace.yaml'
  - '.dockerignore'
  - 'pnpm-lock.yaml'
  - '.github/ci/**'
  - '.github/actions/setup-node/**'
  - 'services/memory-catalog/**'
  - 'contracts/memory-catalog-api/**'
  - 'contracts/codegen/**'
  - '.github/workflows/ci.yml'

github-integration:
  - '.oxlintrc.json'
  - 'package.json'
  - 'pnpm-workspace.yaml'
  - '.dockerignore'
  - 'pnpm-lock.yaml'
  - '.github/actions/setup-node/**'
  # The repo-level trigger configuration the service reads.
  - '.sec-review/**'
  - 'apps/github-integration/**'
  # Its tests validate the shared contract fixtures.
  - 'contracts/**'
  # CI tooling.
  - '.github/workflows/ci.yml'

control-plane-ui:
  - '.oxlintrc.json'
  - 'package.json'
  - 'pnpm-workspace.yaml'
  - '.dockerignore'
  - 'pnpm-lock.yaml'
  - '.github/workflows/ci-browser.yml'
  - '.github/actions/setup-node/**'
  - 'apps/control-plane-ui/**'
  # Its generated response types and artifact readers consume the shared contracts.
  - 'contracts/**'
  # CI tooling.
  - '.github/workflows/ci.yml'

agents:
  - '.github/actions/check-agents/**'
  - '.github/actions/setup-python/**'
  - 'agents/**'
  # The wheel packages the canonical contract schemas.
  - 'contracts/**'
  # `.sec-review/setup.yml` is parsed and executed by the Execution Worker, so a change to
  # it can affect the agents suite's contract (and the repository's own setup).
  - '.sec-review/**'
  # CI tooling.
  - '.github/workflows/ci.yml'

scripts:
  - '.github/actions/setup-python/**'
  - 'scripts/**'
  # CI tooling.
  - '.github/workflows/ci.yml'

documentation:
  # Documentation.
  - '**/*.md'
  # Root formatting inputs outside workspace packages, plus checkers and setup.
  - '.github/**'
  - '.sec-review/**'
  - 'contracts/spectral-functions/**'
  - 'ops/**'
  - 'scripts/**'
  - 'compose.yaml'
  - 'smoke-tests/**'
  - '.oxlintrc.json'
  - 'package.json'
  - 'pnpm-workspace.yaml'
  - 'pnpm-lock.yaml'
  - '.editorconfig'
  - '.gitignore'
  - '.markdownlint-cli2.jsonc'
  - '.oxfmtrc.json'
  - '.autocorrectrc'
  - 'lefthook.yml'

smoke:
  - '.github/workflows/ci.yml'
  - '.github/ci/**'
  - 'smoke-tests/**'
  - 'compose.yaml'
  - 'ops/rustfs-init/**'
  - 'ops/postgres-init/**'
  - 'services/execution-gateway/**'
  - 'services/review-runs/**'
  - 'services/memory-catalog/**'
  - 'apps/control-plane-ui/**'
  - 'contracts/**'
  - '.oxlintrc.json'
  - 'package.json'
  - 'pnpm-lock.yaml'
  - 'pnpm-workspace.yaml'
  - '.dockerignore'
