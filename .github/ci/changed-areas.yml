# The changed-area filter set `dorny/paths-filter` reads (see ci.yml, `Detect changed areas`).
#
# This file is the single source of truth for which changes run which jobs: each top-level key
# is an area a job gates on (`needs.changes.outputs.<area>`), and the globs under it select the
# area. It is read directly — there is no generator — and `check-changed-areas.mjs` guards it.
#
# Every glob that belongs to an area that reads the shared contract, or that can affect how a
# job runs, is listed under that area too: CI cannot see those couplings in an import graph, so
# they are written down here. The validator checks them (and that every tracked file is covered
# by an area or is an acknowledged exception).
#
# Comments are free-form; the validator reads only the area keys and their globs.

automation-config:
  # Dependabot configuration and the workflow definitions themselves.
  - ".github/dependabot.yml"
  - ".github/workflows/**"
  # Repository-wide editor defaults used by maintainers and agents.
  - ".editorconfig"
  # The changed-area model and its validator.
  - ".github/ci/**"

ops:
  # Deployment scripts and the Compose topology.
  - "ops/**"
  - "compose.yaml"
  - "compose.env.sample"
  - "compose.memory.env.sample"
  # A CI change can affect how ops is validated.
  - ".github/workflows/ci.yml"

contract-tools:
  # The per-family tools and the contract trees they own.
  - "contracts/**"
  # Every projection a contract tool renders into another package. The validator derives this
  # set from the tools' generated-artifacts.json manifests, so a new projection cannot be added
  # without wiring it here.
  - "review-runs/src/contract-types-generated.ts"
  - "review-runs/src/error-codes-generated.ts"
  - "review-runs/src/execution-api-schema.ts"
  - "apps/github-integration/src/review-runs/review-runs-api.ts"
  - "apps/control-plane-ui/shared/list-run-query-params.ts"
  - "apps/control-plane-ui/browser/features/runs/api-types.generated.ts"
  - "apps/control-plane-ui/browser/features/runs/state-machines.generated.ts"
  - "review-runs/src/state-machines.generated.ts"
  - "apps/github-integration/src/execution/execution-api-types-generated.ts"
  - "apps/github-integration/src/execution/execution-api-version.ts"
  - "execution-gateway/src/execution-api-types-generated.ts"
  - "execution-gateway/src/execution-api-version.ts"
  - "memory-catalog/src/contract-types-generated.ts"
  - "apps/control-plane-ui/browser/features/memory/api-types.generated.ts"
  # CI tooling.
  - ".github/ci/**"
  - ".github/workflows/ci.yml"

review-runs:
  - "review-runs/**"
  # It validates requests against the shared contract schemas.
  - "contracts/**"
  # Its integration suite's client<->server seam test drives the GitHub integration client
  # against the real server, so a client change must re-run this job.
  - "apps/github-integration/src/review-runs/client.ts"
  - "apps/github-integration/src/review-runs/review-runs-api.ts"
  # CI tooling.
  - ".github/ci/**"
  - ".github/workflows/ci.yml"

execution-gateway:
  - "execution-gateway/**"
  - "contracts/execution-api/**"
  - "contracts/execution-workflow/**"
  - ".github/workflows/ci.yml"

memory-catalog:
  - "memory-catalog/**"
  - "contracts/memory-catalog-api/**"
  - ".github/workflows/ci.yml"

github-integration:
  # The repo-level trigger configuration the service reads.
  - ".sec-review/**"
  - "apps/github-integration/**"
  # Its tests validate the shared contract fixtures.
  - "contracts/**"
  # CI tooling.
  - ".github/workflows/ci.yml"

control-plane-ui:
  - "apps/control-plane-ui/**"
  # It pins its response type to the shared contract fixture.
  - "contracts/**"
  # CI tooling.
  - ".github/workflows/ci.yml"

agents:
  - "agents/**"
  # The wheel packages the canonical contract schemas.
  - "contracts/**"
  # `.sec-review/setup.yml` is parsed and executed by the Execution Worker, so a change to
  # it can affect the agents suite's contract (and the repository's own setup).
  - ".sec-review/**"
  # CI tooling.
  - ".github/workflows/ci.yml"

scripts:
  - "scripts/**"
  # CI tooling.
  - ".github/workflows/ci.yml"

documentation:
  # Documentation.
  - "**/*.md"
  # The documentation checkers.
  - "scripts/check_markdown_links.py"
  - "scripts/check_markdown_wrapping.py"
  - "scripts/check_translated_doc_headings.py"
  - "scripts/markdown_check_utils.py"
  # CI tooling.
  - ".github/workflows/ci.yml"
