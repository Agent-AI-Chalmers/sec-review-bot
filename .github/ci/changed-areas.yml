  - ".dockerignore"
  - "pnpm-lock.yaml"
  - ".github/ci/**"
  - ".github/actions/setup-node/**"
  - "services/memory-catalog/**"
  - "contracts/memory-catalog-api/**"
  - "contracts/codegen/**"
  - ".github/workflows/ci.yml"

github-integration:
  - "package.json"
  - "pnpm-workspace.yaml"
  - ".dockerignore"
  - "pnpm-lock.yaml"
  - ".github/actions/setup-node/**"
  # The repo-level trigger configuration the service reads.
  - ".sec-review/**"
  - "apps/github-integration/**"
  # Its tests validate the shared contract fixtures.
  - "contracts/**"
  # CI tooling.
  - ".github/workflows/ci.yml"

control-plane-ui:
  - "package.json"
  - "pnpm-workspace.yaml"
  - ".dockerignore"
  - "pnpm-lock.yaml"
  - ".github/workflows/ci-browser.yml"
  - ".github/actions/setup-node/**"
  - "apps/control-plane-ui/**"
  # It pins its response type to the shared contract fixture.
  - "contracts/**"
  # CI tooling.
  - ".github/workflows/ci.yml"

agents:
  - ".github/actions/check-agents/**"
  - ".github/actions/setup-python/**"
  - "agents/**"
  # The wheel packages the canonical contract schemas.
  - "contracts/**"
  # `.sec-review/setup.yml` is parsed and executed by the Execution Worker, so a change to
  # it can affect the agents suite's contract (and the repository's own setup).
  - ".sec-review/**"
  # CI tooling.
  - ".github/workflows/ci.yml"

scripts:
  - ".github/actions/setup-python/**"
  - "scripts/**"
  - "system-tests/**"
  # CI tooling.
  - ".github/workflows/ci.yml"

documentation:
  # Documentation.
  - "**/*.md"
  # The documentation checkers.
  - "scripts/checks/**"
  # CI tooling.
  - ".github/workflows/ci.yml"

