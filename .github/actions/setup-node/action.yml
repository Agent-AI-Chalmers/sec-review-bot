name: Set up Node package
description: Install pnpm, select the package's Node version, and install the locked repository workspace.
inputs:
  directory:
    description: Package directory relative to the repository root.
    required: true
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        run_install: false
    - uses: actions/setup-node@v7
      with:
        node-version-file: ${{ inputs.directory }}/package.json
        check-latest: true
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.workspace }}
      run: pnpm install --frozen-lockfile
    - name: Check Node.js package boundaries
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        node --test .github/ci/check-package-boundaries.test.mjs
        node .github/ci/check-package-boundaries.mjs
