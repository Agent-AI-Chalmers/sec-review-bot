packages:
  - 'apps/*'
  - 'services/*'
  - 'contracts/codegen'
  - 'contracts/*/tools'
  - 'contracts/tar-zstd-artifact/envelope/tools'
  - 'contracts/tar-zstd-artifact/profiles/*/tools'

allowBuilds:
  esbuild: true
  # Hooks are installed by the root `prepare` script, not by the package install script.
  lefthook: false
  '@scarf/scarf': false
  protobufjs: false
