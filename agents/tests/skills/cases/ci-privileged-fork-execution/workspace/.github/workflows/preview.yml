name: Preview
on:
  pull_request_target:
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: npm install
      - run: npm run preview
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
