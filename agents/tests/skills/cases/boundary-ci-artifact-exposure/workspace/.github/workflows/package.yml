name: package
on: workflow_dispatch
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - run: cp "$SIGNING_KEY" dist/signing-key.pem
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY_PATH }}
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/
