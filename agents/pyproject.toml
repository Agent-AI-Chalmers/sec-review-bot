[project]
name = "sec-review-agents"
version = "0.1.0"
description = "Python review runner and stage workflow implementation for sec-review-agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
  "deepagents>=0.7.32",
  "langfuse>=5.0.4",
  "langchain>=1.4.7",
  "langchain-core>=1.7.1",
  "langgraph>=1.2.18",
  "langchain-anthropic>=1.7.7",
  "langchain-google-genai>=4.4.2",
  "langchain-mcp-adapters>=0.3.2",
  "langchain-openai>=1.7.3",
  "jsonschema>=4.26.0",
  "pyyaml>=6.0.3",
  "pydantic>=2.14.1",
  "cvss>=3.6",
  "structlog>=26.1.0",
  "temporalio>=1.34.0",
  "boto3>=1.43.120",
  "yamlcore>=0.0.4",
]

[dependency-groups]
test = [
  "pytest>=9.2.0",
  "pytest-asyncio>=1.4.1",
  "pytest-timeout>=2.4.0",
]
lint = [
  "black>=26.10.1",
  "ruff>=0.17.3",
]
typecheck = [
  "hatchling>=1.33.0",
  "mypy>=2.4.0",
  "pyright>=1.1.414",
  "types-PyYAML>=6.0.12.20260906",
  "types-jsonschema>=4.26.0.20261006",
]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "typecheck" },
]

[project.scripts]
sec-review-execution-worker = "sec_review_agents.entrypoints.execution_worker.main:main"
sec-review-memory-extraction-worker = "sec_review_agents.entrypoints.memory_extraction_worker.main:main"
sec-review-memory-maintenance-worker = "sec_review_agents.entrypoints.memory_maintenance_worker.main:main"
sec-review-agents-check-llm-deployments = "sec_review_agents.cli.check_llm_deployments:main"
sec-review-agents-run-local-issue = "sec_review_agents.cli.run_local_issue:main"
sec-review-agents-run-local-pr = "sec_review_agents.cli.run_local_pr:main"
sec-review-agents-run-local-repository = "sec_review_agents.cli.run_local_repository:main"
sec-review-agents-memory = "sec_review_agents.cli.memory:main"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
asyncio_default_fixture_loop_scope = "function"
# A hung test is indistinguishable from a slow one until it finishes. Without a bound, an
# environment that lacks Docker or network sits in a container command for the backend's
# 10-minute default instead of reporting the tests that need it. This is a backstop: tests that
# legitimately need longer mark themselves with `@pytest.mark.timeout(...)`.
timeout = 300
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: requires a real runtime or external process beyond ordinary in-process tests",
  "llm: invokes a real language model and is gated from normal test runs",
]

[tool.ruff]
target-version = "py314"
# Explicit wrap width. 88 is Black's (and Ruff's) default; writing it here makes
# the choice visible and prevents a tool default change from silently moving it.
line-length = 88

[tool.ruff.lint]
extend-select = ["I", "E402"]
ignore = [
  "B008",   # FastAPI dependency defaults intentionally call Body/Depends.
  "B017",   # Temporal tests intentionally assert framework-wrapped failures.
  "BLE001", # Boundary layers intentionally convert arbitrary failures.
  "FLY002", # Prompt/fixture blocks are clearer as joins than collapsed literals.
  "S110",   # Best-effort cleanup/serialization paths intentionally suppress failures.
  "TRY004", # Public validation paths intentionally keep ValueError contracts.
]

[tool.black]
target-version = ["py314"]
# Keep Black and Ruff on the same width (see [tool.ruff] above).
line-length = 88

[tool.mypy]
exclude = "^tests/.*/cases/[^/]+/workspace/"

[tool.pyright]
pythonVersion = "3.14"
exclude = ["tests/**/cases/*/workspace"]
reportUnusedFunction = "error"
reportUnusedClass = "error"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sec_review_agents"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
  "/hatch_build.py",
  "/src/sec_review_agents",
  "/README.md",
]
