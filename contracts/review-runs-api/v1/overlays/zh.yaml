# Chinese text for the Review Runs state machines, written as an OpenAPI Overlay 1.0.0 document.
# openapi.yaml stays English-only and defines every state and transition; this overlay replaces only
# the human-readable title, label, summary, and description. The state-machine generator applies it and fails
# when an action matches no node or more than one, when a text field has no translation, or when an
# action updates anything other than those text fields.
overlay: 1.0.0
info:
  title: Review Runs state machines (Chinese)
  version: 1.0.0
extends: ../openapi.yaml
actions:
  - target: "$['x-state-machines'].preparation"
    update:
      title: '准备'
  - target: "$['x-state-machines'].preparation.states.pending"
    update:
      label: '等待中'
      description: "运行已接收，尚无准备进程领取任务。"
      summary: "运行已接收，等待准备审查输入。"
  - target: "$['x-state-machines'].preparation.states.preparing"
    update:
      label: '准备中'
      description: "协调进程已领取准备任务，正在构建执行所需的输入。"
      summary: "正在准备审查输入。"
  - target: "$['x-state-machines'].preparation.states.uncertain"
    update:
      label: '待确认'
      description: "准备进程尚未报告结果，认领就已过期，因此无法确认准备好的输入是否已送达 Review Runs。这不表示准备失败。任务可被重新领取，并使用同一运行标识重建、提交输入；重复提交是幂等的。"
      summary: "准备认领已过期，输入是否已保存待确认；可用同一运行标识重新提交。"
  - target: "$['x-state-machines'].preparation.states.disconnected"
    update:
      label: '失联'
      description: "已保存的运行状态不允许执行认领过期时应有的状态转换，因此自动处理已停止，尚无最终结论。系统不会自行重试；管理员可将其恢复为 `uncertain`、放弃等待或作废运行。"
      summary: "准备与执行记录冲突，自动恢复已停止，需人工核查。"
  - target: "$['x-state-machines'].preparation.states.submitted"
    update:
      label: '已提交'
      description: "输入已被接受并提交给 Execution API 提供方，准备阶段已完成。"
      summary: "输入已准备完成并提交执行。"
  - target: "$['x-state-machines'].preparation.states.failed"
    update:
      label: '失败'
      description: "准备阶段已结束，未得到可用结果。可能是准备永久失败（重试次数用尽或无法构建输入），此时输入从未提交给 Execution API 提供方，执行会被跳过；也可能是管理员对失联的准备任务选择放弃等待或作废运行，此时输入可能已经提交，任务可能仍在远端执行。"
      summary: "准备已永久失败或由人工结束。永久失败会跳过执行；人工结束后远端任务仍可能继续。"
  - target: "$['x-state-machines'].preparation.transitions[?@.from=='pending' && @.to=='preparing' && !@.reason]"
    update:
      label: '已领取'
  - target: "$['x-state-machines'].preparation.transitions[?@.from=='preparing' && @.to=='submitted' && !@.reason]"
    update:
      label: '输入已被接受'
  - target: "$['x-state-machines'].preparation.transitions[?@.from=='preparing' && @.to=='pending' && !@.reason]"
    update:
      label: '重试'
  - target: "$['x-state-machines'].preparation.transitions[?@.from=='preparing' && @.to=='uncertain' && !@.reason]"
    update:
      label: '认领过期'
  - target: "$['x-state-machines'].preparation.transitions[?@.from=='uncertain' && @.to=='preparing' && !@.reason]"
    update:
      label: "重新领取准备任务"
  - target: "$['x-state-machines'].preparation.transitions[?@.from=='preparing' && @.to=='disconnected' && @.reason=='EXECUTION_ALREADY_ADVANCED']"
    update:
      label: "无法自动结束准备"
  - target: "$['x-state-machines'].preparation.transitions[?@.from=='disconnected' && @.to=='uncertain' && @.reason=='PREPARATION_RESUMED_BY_OPERATOR']"
    update:
      label: '由管理员恢复'
  - target: "$['x-state-machines'].preparation.transitions[?@.from=='disconnected' && @.to=='failed' && @.reason=='PREPARATION_GIVEN_UP_BY_OPERATOR']"
    update:
      label: '由管理员放弃等待'
  - target: "$['x-state-machines'].preparation.transitions[?@.from=='disconnected' && @.to=='failed' && @.reason=='PREPARATION_ABANDONED_BY_OPERATOR']"
    update:
      label: '由管理员作废'
  - target: "$['x-state-machines'].preparation.transitions[?@.from=='preparing' && @.to=='failed' && !@.reason]"
    update:
      label: '失败'
  - target: "$['x-state-machines'].execution"
    update:
      title: '执行'
  - target: "$['x-state-machines'].execution.states.pending"
    update:
      label: '等待中'
      description: "运行已接收，准备好的输入尚未提交给 Execution API 提供方。"
      summary: "等待将准备好的输入提交给执行服务。"
  - target: "$['x-state-machines'].execution.states.queued"
    update:
      label: '排队中'
      description: "Execution API 提供方已接受任务，轮询尚未发现任务开始执行。"
      summary: "执行服务已接受任务，尚未观察到任务开始执行。"
  - target: "$['x-state-machines'].execution.states.running"
    update:
      label: '执行中'
      description: "轮询结果表明，Execution API 提供方正在执行该任务。轮询期间出现临时网络错误时，系统会保留上次获取的状态并继续查询，因此显示的状态可能滞后。"
      summary: "最近报告为执行中；查询暂时失败时保留原状态，显示可能滞后。"
  - target: "$['x-state-machines'].execution.states.succeeded"
    update:
      label: '执行成功'
      description: "Execution API 提供方已返回结果，可以开始发布。"
      summary: "执行服务已返回成功结果，可以开始发布。"
  - target: "$['x-state-machines'].execution.states.skipped"
    update:
      label: '已跳过'
      description: "准备失败，执行未开始。失败原因记录在准备轴上，不属于执行失败。"
      summary: "准备失败，执行已跳过。具体原因见准备阶段的失败信息。"
  - target: "$['x-state-machines'].execution.states.uncertain"
    update:
      label: '待确认'
      description: "任务已提交，但未收到响应，无法确认 Execution API 提供方是否已接受任务。这不表示执行失败；系统会使用同一个 run_id 重新提交。"
      summary: "任务是否已被接受待确认；系统会用同一运行标识重新提交。"
  - target: "$['x-state-machines'].execution.states.disconnected"
    update:
      label: '失联'
      description: "自动恢复次数已用尽，Execution API 提供方仍未给出确定答复。该运行将等待管理员处理，不会被记为失败。"
      summary: "恢复次数已用尽，提交结果仍未知，需人工核查；不代表执行失败。"
  - target: "$['x-state-machines'].execution.states.failed"
    update:
      label: '失败'
      description: "该运行已停止跟踪执行状态。可能是轮询确认了失败（Execution API 提供方报告失败、找不到运行、未返回结果或响应违反协议），或重新提交时收到确定的失败答复；也可能是管理员对失联的执行选择放弃等待，或作废了准备阶段。管理员的这些操作不会发送取消请求，远端任务仍可能继续执行并成功。临时网络错误（超时、5xx、连接中断）不属于确定的失败。"
      summary: "因失败、结果不可用或人工决定而停止跟踪；停止等待不会取消远端任务。"
  - target: "$['x-state-machines'].execution.transitions[?@.from=='pending' && @.to=='queued' && !@.reason]"
    update:
      label: '输入已提交'
  - target: "$['x-state-machines'].execution.transitions[?@.from=='pending' && @.to=='skipped' && !@.reason]"
    update:
      label: '准备失败'
  - target: "$['x-state-machines'].execution.transitions[?@.from=='pending' && @.to=='uncertain' && @.reason=='SUBMISSION_STATE_UNCERTAIN']"
    update:
      label: '提交未得到确认'
  - target: "$['x-state-machines'].execution.transitions[?@.from=='uncertain' && @.to=='uncertain' && @.reason=='SUBMISSION_RECOVERY_CLAIMED']"
    update:
      label: "领取重新提交任务"
  - target: "$['x-state-machines'].execution.transitions[?@.from=='uncertain' && @.to=='queued' && !@.reason]"
    update:
      label: "重新提交已被接受"
  - target: "$['x-state-machines'].execution.transitions[?@.from=='uncertain' && @.to=='failed' && !@.reason]"
    update:
      label: "重新提交被拒绝"
  - target: "$['x-state-machines'].execution.transitions[?@.from=='uncertain' && @.to=='disconnected' && @.reason=='SUBMISSION_RECOVERY_EXHAUSTED']"
    update:
      label: "自动恢复已停止"
  - target: "$['x-state-machines'].execution.transitions[?@.from=='disconnected' && @.to=='uncertain' && @.reason=='SUBMISSION_RECOVERY_RESUMED_BY_OPERATOR']"
    update:
      label: '由管理员恢复'
  - target: "$['x-state-machines'].execution.transitions[?@.from=='disconnected' && @.to=='failed' && @.reason=='SUBMISSION_RECOVERY_GIVEN_UP_BY_OPERATOR']"
    update:
      label: '由管理员放弃等待'
  - target: "$['x-state-machines'].execution.transitions[?@.from=='queued' && @.to=='running' && !@.reason]"
    update:
      label: '开始执行'
  - target: "$['x-state-machines'].execution.transitions[?@.from=='queued' && @.to=='succeeded' && !@.reason]"
    update:
      label: '执行成功'
  - target: "$['x-state-machines'].execution.transitions[?@.from=='running' && @.to=='succeeded' && !@.reason]"
    update:
      label: '执行成功'
  - target: "$['x-state-machines'].execution.transitions[?@.from=='queued' && @.to=='failed' && !@.reason]"
    update:
      label: '轮询确认失败'
  - target: "$['x-state-machines'].execution.transitions[?@.from=='running' && @.to=='failed' && !@.reason]"
    update:
      label: '轮询确认失败'
  - target: "$['x-state-machines'].publication"
    update:
      title: '发布'
  - target: "$['x-state-machines'].publication.states.pending"
    update:
      label: '等待中'
      description: "等待执行成功并返回结果，再开始发布。"
      summary: "等待可发布的执行成功结果。"
  - target: "$['x-state-machines'].publication.states.publishing"
    update:
      label: '发布中'
      description: "协调进程已领取发布任务，正在执行远端发布操作。"
      summary: "正在发布审查结果。"
  - target: "$['x-state-machines'].publication.states.uncertain"
    update:
      label: '待确认'
      description: "某个发布步骤可能已在远端生效，系统正在核对结果。发布轴的状态由优先级最高的步骤状态决定。此状态不表示失败，其他步骤仍可继续发布。"
      summary: "某个步骤可能已生效，正在核对；其他步骤可继续，尚未判定失败。"
  - target: "$['x-state-machines'].publication.states.disconnected"
    update:
      label: '失联'
      description: "某个发布步骤的自动核对已停止，结果仍不确定，需要管理员核查远端情况。发布轴的状态由优先级最高的步骤状态决定。"
      summary: "自动核对已停止，某个步骤的远端结果仍待人工确认。"
  - target: "$['x-state-machines'].publication.states.published"
    update:
      label: '已发布'
      description: "所有发布步骤均已成功，结果已可见。"
      summary: "所有发布步骤均已成功，结果已可见。"
  - target: "$['x-state-machines'].publication.states.failed"
    update:
      label: '失败'
      description: "发布已结束并记为失败：可能是负责发布的进程确认发布失败（例如发生不可重试的失败，或仍有步骤未成功），也可能是管理员放弃等待。可重试的失败会回到 `pending`。"
      summary: "发布失败或由人工停止，部分步骤可能已生效；可重试的失败会重新排队。"
  - target: "$['x-state-machines'].publication.states.skipped"
    update:
      label: '已跳过'
      description: "执行没有成功，因此没有可发布的内容。"
      summary: "执行未成功，不会发布结果。"
  - target: "$['x-state-machines'].publication.transitions[?@.from=='pending' && @.to=='publishing' && !@.reason]"
    update:
      label: '开始发布'
  - target: "$['x-state-machines'].publication.transitions[?@.from=='pending' && @.to=='uncertain' && !@.reason]"
    update:
      label: "恢复发布，仍有步骤待确认"
  - target: "$['x-state-machines'].publication.transitions[?@.from=='uncertain' && @.to=='uncertain' && @.reason=='PUBLICATION_LEASE_EXPIRED']"
    update:
      label: '核对租约过期'
  - target: "$['x-state-machines'].publication.transitions[?@.from=='publishing' && @.to=='uncertain' && !@.reason]"
    update:
      label: '某个步骤可能已生效'
  - target: "$['x-state-machines'].publication.transitions[?@.from=='uncertain' && @.to=='publishing' && !@.reason]"
    update:
      label: '步骤已确认，继续发布'
  - target: "$['x-state-machines'].publication.transitions[?@.from=='uncertain' && @.to=='disconnected' && !@.reason]"
    update:
      label: '核对无法得出结论'
  - target: "$['x-state-machines'].publication.transitions[?@.from=='disconnected' && @.to=='pending' && @.reason=='PUBLICATION_RESUMED_BY_OPERATOR']"
    update:
      label: '由管理员恢复'
  - target: "$['x-state-machines'].publication.transitions[?@.from=='disconnected' && @.to=='failed' && @.reason=='PUBLICATION_GIVEN_UP_BY_OPERATOR']"
    update:
      label: '由管理员放弃等待'
  - target: "$['x-state-machines'].publication.transitions[?@.from=='publishing' && @.to=='published' && !@.reason]"
    update:
      label: '已发布'
  - target: "$['x-state-machines'].publication.transitions[?@.from=='publishing' && @.to=='publishing' && @.reason=='PUBLICATION_LEASE_EXPIRED']"
    update:
      label: '发布租约过期'
  - target: "$['x-state-machines'].publication.transitions[?@.from=='publishing' && @.to=='pending' && !@.reason]"
    update:
      label: '可重试的失败'
  - target: "$['x-state-machines'].publication.transitions[?@.from=='publishing' && @.to=='failed' && !@.reason]"
    update:
      label: "不可重试的失败"
  - target: "$['x-state-machines'].publication.transitions[?@.from=='uncertain' && @.to=='pending' && !@.reason]"
    update:
      label: '可重试的失败'
  - target: "$['x-state-machines'].publication.transitions[?@.from=='uncertain' && @.to=='failed' && !@.reason]"
    update:
      label: "不可重试的失败"
  - target: "$['x-state-machines'].publication.transitions[?@.from=='pending' && @.to=='skipped' && !@.reason]"
    update:
      label: '执行结果不发布'
  - target: "$['x-state-machines'].publication.transitions[?@.from=='publishing' && @.to=='skipped' && @.reason=='PUBLICATION_ABANDONED']"
    update:
      label: '执行失败'
  - target: "$['x-state-machines'].publication.step.states.pending"
    update:
      label: '等待中'
      description: "该步骤尚未尝试，或已由管理员重新排队并重置允许尝试和核对的次数。"
      summary: "尚未尝试，或已由管理员重新排队并重置尝试与核对次数。"
  - target: "$['x-state-machines'].publication.step.states.running"
    update:
      label: '进行中'
      description: "一次发布尝试已开始。负责该步骤的进程可能仍在执行，也可能在远端操作生效后中断。后续进程领取任务时，必须考虑操作已生效的可能。"
      summary: "尝试已开始；即使进程中断，远端操作也可能已生效。"
  - target: "$['x-state-machines'].publication.step.states.failed"
    update:
      label: '尝试失败'
      description: "上一次尝试失败。有剩余尝试次数时会重试；次数用尽后，须先核对远端结果，再确定最终状态。"
      summary: "上次尝试失败；有剩余次数可重试，否则须先核对远端结果。"
  - target: "$['x-state-machines'].publication.step.states.uncertain"
    update:
      label: '待确认'
      description: "尝试次数已用尽，之前的尝试可能已在远端生效。连接器必须先核对远端结果，才能结束该步骤。"
      summary: "尝试次数已用尽，先前操作可能已生效；须核对远端结果后才能结束。"
  - target: "$['x-state-machines'].publication.step.states.disconnected"
    update:
      label: '失联'
      description: "核对次数已用尽，仍无法确认结果，需要管理员核查远端情况。"
      summary: "核对次数已用尽，远端结果仍待人工确认。"
  - target: "$['x-state-machines'].publication.step.states.succeeded"
    update:
      label: '发布成功'
      description: "远端操作已生效：发布尝试已报告成功，或后续核对已确认结果存在。"
      summary: "远端操作已成功完成，或已通过后续核对确认。"
  - target: "$['x-state-machines'].publication.step.states.terminal_failed"
    update:
      label: '最终失败'
      description: "该步骤不会再次尝试：某次尝试发生不可重试的失败，或核对已确认远端操作未生效。"
      summary: "不会再尝试：已发生不可重试的失败，或已确认远端操作未生效。"
  - target: "$['x-state-machines'].publication.step.transitions[?@.from=='pending' && @.to=='running' && !@.reason]"
    update:
      label: '开始尝试'
  - target: "$['x-state-machines'].publication.step.transitions[?@.from=='running' && @.to=='running' && !@.reason]"
    update:
      label: '由另一处理进程接管'
  - target: "$['x-state-machines'].publication.step.transitions[?@.from=='failed' && @.to=='running' && !@.reason]"
    update:
      label: '开始重试'
  - target: "$['x-state-machines'].publication.step.transitions[?@.from=='running' && @.to=='succeeded' && !@.reason]"
    update:
      label: "远端操作已生效"
  - target: "$['x-state-machines'].publication.step.transitions[?@.from=='running' && @.to=='failed' && !@.reason]"
    update:
      label: '可重试的失败'
  - target: "$['x-state-machines'].publication.step.transitions[?@.from=='running' && @.to=='terminal_failed' && !@.reason]"
    update:
      label: "不可重试的失败"
  - target: "$['x-state-machines'].publication.step.transitions[?@.from=='running' && @.to=='uncertain' && !@.reason]"
    update:
      label: '尝试次数用尽'
  - target: "$['x-state-machines'].publication.step.transitions[?@.from=='failed' && @.to=='uncertain' && !@.reason]"
    update:
      label: '尝试次数用尽'
  - target: "$['x-state-machines'].publication.step.transitions[?@.from=='uncertain' && @.to=='succeeded' && !@.reason]"
    update:
      label: "已确认远端操作生效"
  - target: "$['x-state-machines'].publication.step.transitions[?@.from=='uncertain' && @.to=='terminal_failed' && !@.reason]"
    update:
      label: "已确认未生效或不可重试"
  - target: "$['x-state-machines'].publication.step.transitions[?@.from=='uncertain' && @.to=='uncertain' && !@.reason]"
    update:
      label: "核对结果仍不确定"
  - target: "$['x-state-machines'].publication.step.transitions[?@.from=='uncertain' && @.to=='disconnected' && !@.reason]"
    update:
      label: "核对次数用尽"
  - target: "$['x-state-machines'].publication.step.transitions[?@.from=='uncertain' && @.to=='failed' && !@.reason]"
    update:
      label: '报告失败且不重试'
  - target: "$['x-state-machines'].publication.step.transitions[?@.from=='disconnected' && @.to=='pending' && @.reason=='PUBLICATION_RESUMED_BY_OPERATOR']"
    update:
      label: '由管理员恢复'
