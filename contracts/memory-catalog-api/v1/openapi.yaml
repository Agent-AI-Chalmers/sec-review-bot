openapi: 3.1.0
info:
  title: Memory Catalog API
  version: v1
  description: |
    Hand-maintained single source of truth for the memory coordination HTTP
    boundary. Service implementations and generated types consume this document;
    service code does not generate it.
x-contract-source: hand-maintained
components:
  securitySchemes:
    catalogToken:
      type: http
      scheme: bearer
      description: Worker or operator credential for shared catalog reads and role-checked version creation.
    workerToken:
      type: http
      scheme: bearer
      description: Worker credential for extraction and learning or reorganization versions.
    operatorToken:
      type: http
      scheme: bearer
      description: Operator credential for memory-tree automation control and manual memory changes.
  schemas:
    ArtifactReference:
      type: object
      additionalProperties: false
      required: [uri, digest, media_type, size_bytes]
      properties:
        uri:
          type: string
          pattern: ^s3://
        digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        media_type:
          type: string
          minLength: 1
        size_bytes:
          type: integer
          minimum: 0
    ExtractionId:
      type: string
      minLength: 1
      pattern: "^[A-Za-z0-9._:-]+$"
    OperationId:
      type: string
      minLength: 1
      pattern: "^[A-Za-z0-9._:-]+$"
    Actor:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [user, service]
        id:
          type: string
          minLength: 1
    ExtractionObservation:
      type: object
      additionalProperties: false
      required: [observation_id, body_markdown]
      properties:
        observation_id:
          type: string
          minLength: 1
        body_markdown: { type: string, minLength: 1 }
    ExtractionRegistration:
      type: object
      additionalProperties: false
      required:
        - extraction_id
        - source_workflow
        - source_run_id
        - source_unit_id
        - execution_archive_digest
        - trajectory_reference
        - observations
      properties:
        extraction_id:
          $ref: "#/components/schemas/ExtractionId"
        source_workflow: { type: string, minLength: 1 }
        source_run_id: { type: string, minLength: 1 }
        source_unit_id: { type: string, minLength: 1 }
        execution_archive_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        trajectory_reference:
          $ref: "#/components/schemas/ArtifactReference"
        observations:
          type: array
          items:
            $ref: "#/components/schemas/ExtractionObservation"
    ExtractionPublicationIntent:
      type: object
      additionalProperties: false
      required: [registration, summary]
      properties:
        registration:
          $ref: "#/components/schemas/ExtractionRegistration"
        summary: { type: string }
    ExtractionPublication:
      type: object
      additionalProperties: false
      required: [intent, status]
      properties:
        intent:
          $ref: "#/components/schemas/ExtractionPublicationIntent"
        status: { type: string, enum: [reserved, present, selected] }
    ExtractionPublicationList:
      type: object
      additionalProperties: false
      required: [publications]
      properties:
        publications:
          type: array
          items:
            $ref: "#/components/schemas/ExtractionPublication"
    AutomaticVersionPublicationOwner:
      type: object
      additionalProperties: false
      required: [kind, operation_id]
      properties:
        kind: { type: string, enum: [learning, reorganization] }
        operation_id: { type: string, minLength: 1, pattern: "^[A-Za-z0-9._:-]+$" }
    VersionPublication:
      type: object
      additionalProperties: false
      required: [intent, status]
      properties:
        intent:
          $ref: "#/components/schemas/MemoryTreeVersionCreation"
        status: { type: string, enum: [reserved, present, selected, abandoned] }
    VersionPublicationList:
      type: object
      additionalProperties: false
      required: [publications]
      properties:
        publications:
          type: array
          items:
            $ref: "#/components/schemas/VersionPublication"
    ExtractionRegistrationResult:
      type: object
      additionalProperties: false
      required: [ok, created]
      properties:
        ok: { type: boolean, const: true }
        created: { type: boolean }
    ExtractionRecord:
      type: object
      additionalProperties: false
      required:
        - extraction_id
        - source_workflow
        - source_run_id
        - source_unit_id
        - execution_archive_digest
        - trajectory_reference
        - observations
        - created_at
      properties:
        extraction_id:
          $ref: "#/components/schemas/ExtractionId"
        source_workflow: { type: string, minLength: 1 }
        source_run_id: { type: string, minLength: 1 }
        source_unit_id: { type: string, minLength: 1 }
        execution_archive_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        trajectory_reference:
          $ref: "#/components/schemas/ArtifactReference"
        observations:
          type: array
          items:
            $ref: "#/components/schemas/ExtractionObservation"
        created_at:
          type: string
          format: date-time
    ExtractionList:
      type: object
      additionalProperties: false
      required: [extractions, next_cursor]
      properties:
        extractions:
          type: array
          items:
            $ref: "#/components/schemas/ExtractionRecord"
        next_cursor:
          type: [string, "null"]
    ObservationRecord:
      type: object
      additionalProperties: false
      required:
        - observation_id
        - extraction_id
        - source_run_id
        - source_unit_id
        - body_markdown
        - consumed_version
        - created_at
      properties:
        observation_id:
          type: string
          minLength: 1
        extraction_id:
          $ref: "#/components/schemas/ExtractionId"
        source_run_id: { type: string, minLength: 1 }
        source_unit_id: { type: string, minLength: 1 }
        body_markdown: { type: string, minLength: 1 }
        consumed_version:
          type: [integer, "null"]
          minimum: 1
        created_at:
          type: string
          format: date-time
    ObservationList:
      type: object
      additionalProperties: false
      required: [observations, next_cursor]
      properties:
        observations:
          type: array
          items:
            $ref: "#/components/schemas/ObservationRecord"
        next_cursor:
          type: [string, "null"]
    ObservationBacklog:
      type: object
      additionalProperties: false
      required: [pending_count, oldest_pending_created_at]
      properties:
        pending_count: { type: integer, minimum: 0 }
        oldest_pending_created_at:
          type: [string, "null"]
          format: date-time
    CatalogOverviewTotals:
      type: object
      additionalProperties: false
      required:
        - completed_extraction_count
        - extracted_unit_count
        - units_with_observation_count
        - units_without_observation_count
        - observation_count
        - pending_observation_count
        - consumed_observation_count
      properties:
        completed_extraction_count: { type: integer, minimum: 0 }
        extracted_unit_count: { type: integer, minimum: 0 }
        units_with_observation_count: { type: integer, minimum: 0 }
        units_without_observation_count:
          type: integer
          minimum: 0
          description: Distinct source run/unit pairs whose completed extractions have never produced an observation.
        observation_count: { type: integer, minimum: 0 }
        pending_observation_count: { type: integer, minimum: 0 }
        consumed_observation_count: { type: integer, minimum: 0 }
    CatalogOverviewPoint:
      type: object
      additionalProperties: false
      required:
        - period_start
        - extracted_unit_count
        - units_with_observation_count
      properties:
        period_start:
          type: string
          format: date
          description: Inclusive UTC start date of the day or month represented by this point.
        extracted_unit_count: { type: integer, minimum: 0 }
        units_with_observation_count: { type: integer, minimum: 0 }
    CatalogOverviewWorkflow:
      type: object
      additionalProperties: false
      required:
        - source_workflow
        - extracted_unit_count
        - units_with_observation_count
        - units_without_observation_count
      properties:
        source_workflow: { type: string, minLength: 1 }
        extracted_unit_count: { type: integer, minimum: 0 }
        units_with_observation_count: { type: integer, minimum: 0 }
        units_without_observation_count: { type: integer, minimum: 0 }
    CatalogOverview:
      type: object
      additionalProperties: false
      required: [totals, trend_granularity, trend_points, workflows]
      properties:
        totals:
          $ref: "#/components/schemas/CatalogOverviewTotals"
        trend_granularity:
          type: string
          enum: [day, month]
        trend_points:
          type: array
          items:
            $ref: "#/components/schemas/CatalogOverviewPoint"
        workflows:
          type: array
          items:
            $ref: "#/components/schemas/CatalogOverviewWorkflow"
    LearningObservation:
      type: object
      additionalProperties: false
      required: [observation_id, body_markdown]
      properties:
        observation_id:
          type: string
          minLength: 1
        body_markdown: { type: string, minLength: 1 }
    LearningInput:
      type: object
      additionalProperties: false
      required:
        [expected_active_version, active_memory_tree_reference, observations]
      properties:
        expected_active_version:
          type: integer
          minimum: 0
          description: Active version that must still be current when this learning input is committed.
        active_memory_tree_reference:
          oneOf:
            - $ref: "#/components/schemas/ArtifactReference"
            - type: "null"
        observations:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/LearningObservation"
    LearningInputResult:
      type: object
      additionalProperties: false
      required: [input]
      properties:
        input:
          oneOf:
            - $ref: "#/components/schemas/LearningInput"
            - type: "null"
    ObservationDecision:
      type: object
      additionalProperties: false
      description: What the maintainer did with one consumed observation and why.
      required: [observation_id, action, topics, reason]
      properties:
        observation_id:
          type: string
          minLength: 1
        action:
          type: string
          enum: [added, merged, skipped, conflict]
        topics:
          type: array
          maxItems: 64
          description: Memory topic paths edited for this decision; empty only for skipped.
          items: { type: string, minLength: 1, maxLength: 512 }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    MaintenanceReport:
      type: object
      additionalProperties: false
      description: Maintainer account of an automatic version. Learning reports carry exactly one decision per consumed observation; reorganization reports carry none.
      required: [summary, observation_decisions]
      properties:
        summary: { type: string, minLength: 1, maxLength: 4000 }
        observation_decisions:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/ObservationDecision"
    LearningVersionSource:
      type: object
      additionalProperties: false
      required:
        - kind
        - operation_id
        - observation_ids
        - trajectory_reference
        - maintenance_report
      properties:
        kind: { type: string, const: learning }
        operation_id:
          $ref: "#/components/schemas/OperationId"
        observation_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ExtractionId"
        trajectory_reference:
          $ref: "#/components/schemas/ArtifactReference"
        maintenance_report:
          $ref: "#/components/schemas/MaintenanceReport"
    ReorganizationVersionSource:
      type: object
      additionalProperties: false
      description: A maintainer-only curation of existing memory that consumes no observations.
      required:
        - kind
        - operation_id
        - trajectory_reference
        - maintenance_report
      properties:
        kind: { type: string, const: reorganization }
        operation_id:
          $ref: "#/components/schemas/OperationId"
        trajectory_reference:
          $ref: "#/components/schemas/ArtifactReference"
        maintenance_report:
          $ref: "#/components/schemas/MaintenanceReport"
    ManualVersionSource:
      type: object
      additionalProperties: false
      required: [kind, operation_id, actor]
      properties:
        kind: { type: string, const: manual }
        operation_id:
          $ref: "#/components/schemas/OperationId"
        actor:
          $ref: "#/components/schemas/Actor"
    ManualVersionCreationSource:
      type: object
      additionalProperties: false
      required: [kind, operation_id]
      properties:
        kind: { type: string, const: manual }
        operation_id:
          $ref: "#/components/schemas/OperationId"
    MemoryTreeVersionSource:
      oneOf:
        - $ref: "#/components/schemas/LearningVersionSource"
        - $ref: "#/components/schemas/ReorganizationVersionSource"
        - $ref: "#/components/schemas/ManualVersionSource"
    MemoryTreeVersionCreation:
      type: object
      additionalProperties: false
      required: [expected_active_version, memory_tree_reference, source]
      properties:
        expected_active_version:
          type: integer
          minimum: 0
          description: Active version that must still be current for this compare-and-swap commit.
        memory_tree_reference:
          $ref: "#/components/schemas/ArtifactReference"
        source:
          oneOf:
            - $ref: "#/components/schemas/LearningVersionSource"
            - $ref: "#/components/schemas/ReorganizationVersionSource"
            - $ref: "#/components/schemas/ManualVersionCreationSource"
    MemoryTreeVersionCreationResult:
      type: object
      additionalProperties: false
      required: [created, version, source]
      properties:
        created: { type: boolean }
        version: { type: integer, minimum: 1 }
        source:
          oneOf:
            - type: object
              additionalProperties: false
              required: [kind, operation_id]
              properties:
                kind: { type: string, const: learning }
                operation_id:
                  $ref: "#/components/schemas/OperationId"
            - type: object
              additionalProperties: false
              required: [kind, operation_id]
              properties:
                kind: { type: string, const: reorganization }
                operation_id:
                  $ref: "#/components/schemas/OperationId"
            - type: object
              additionalProperties: false
              required: [kind, operation_id]
              properties:
                kind: { type: string, const: manual }
                operation_id:
                  $ref: "#/components/schemas/OperationId"
    MemoryTree:
      type: object
      additionalProperties: false
      required: [version, memory_tree_reference]
      properties:
        version: { type: integer, minimum: 0 }
        memory_tree_reference:
          oneOf:
            - $ref: "#/components/schemas/ArtifactReference"
            - type: "null"
    MemoryTreeVersion:
      type: object
      additionalProperties: false
      required:
        - version
        - predecessor_version
        - memory_tree_reference
        - source
        - created_at
      properties:
        version: { type: integer, minimum: 1 }
        predecessor_version:
          type: [integer, "null"]
          minimum: 1
          description: Version that was active when this version was created; null for the first version.
        memory_tree_reference:
          $ref: "#/components/schemas/ArtifactReference"
        source:
          $ref: "#/components/schemas/MemoryTreeVersionSource"
        created_at:
          type: string
          format: date-time
    MemoryTreeRestoreOperation:
      type: object
      additionalProperties: false
      required:
        - operation_id
        - expected_active_version
        - restored_version
      properties:
        operation_id:
          $ref: "#/components/schemas/OperationId"
        expected_active_version:
          type: integer
          minimum: 1
        restored_version:
          type: integer
          minimum: 1
    MemoryTreeRestoreOperationResult:
      type: object
      additionalProperties: false
      required: [created, active_version, operation_id]
      properties:
        created: { type: boolean }
        active_version: { type: integer, minimum: 1 }
        operation_id:
          $ref: "#/components/schemas/OperationId"
    MemoryTreeVersionList:
      type: object
      additionalProperties: false
      required: [versions, next_before_version]
      properties:
        versions:
          type: array
          items:
            $ref: "#/components/schemas/MemoryTreeVersion"
        next_before_version:
          type: [integer, "null"]
          minimum: 1
    MemoryTreeAutomation:
      description: Admission state for new learning and reorganization version commits. Pausing does not cancel running work or block manual versions, restores, extraction registration, artifact publication, or successful-operation replays.
      type: object
      additionalProperties: false
      required: [state, version, changed_by, changed_at]
      properties:
        state:
          description: Whether new learning and reorganization versions may commit; this is not a worker execution status.
          type: string
          enum: [enabled, paused]
        version:
          type: integer
          minimum: 0
        changed_by:
          $ref: "#/components/schemas/Actor"
        changed_at:
          type: string
          format: date-time
    MemoryTreeAutomationOperation:
      type: object
      additionalProperties: false
      required: [operation_id, expected_version]
      properties:
        operation_id:
          $ref: "#/components/schemas/OperationId"
        expected_version:
          type: integer
          minimum: 0
    MemoryTreeAutomationOperationResult:
      type: object
      additionalProperties: false
      required: [created, automation]
      properties:
        created: { type: boolean }
        automation:
          $ref: "#/components/schemas/MemoryTreeAutomation"
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: ok }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string }
        code:
          type: string
          enum:
            [INVALID_BODY, UNAUTHORIZED, NOT_FOUND, CONFLICT, AUTOMATION_PAUSED, PUBLICATION_ABANDONED, INTERNAL_ERROR]
  responses:
    InvalidBody:
      description: The JSON body does not match the operation schema.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Missing or invalid catalog bearer token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: An immutable identity differs from existing content, a version compare-and-swap precondition failed, or a learning or reorganization version was attempted while memory-tree automation is paused.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: The requested catalog record does not exist.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    InternalError:
      description: Opaque internal server error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    PayloadTooLarge:
      description: The request body exceeds the service limit.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
paths:
  /healthz:
    get:
      description: Report whether the Memory Catalog process is serving requests.
      operationId: health
      security: []
      responses:
        "200":
          description: Service is running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/extractions:
    get:
      description: List completed extractions newest first with stable cursor pagination.
      operationId: listExtractions
      security: [{ catalogToken: [] }]
      parameters:
        - in: query
          name: cursor
          required: false
          schema: { type: string, minLength: 1 }
        - in: query
          name: limit
          required: false
          schema: { type: string, pattern: "^(?:[1-9]|[1-9][0-9]|100)$" }
        - in: query
          name: source_workflow
          required: false
          schema: { type: string, minLength: 1 }
        - in: query
          name: source_run_id
          required: false
          schema: { type: string, minLength: 1 }
        - in: query
          name: has_observation
          required: false
          schema: { type: string, enum: ["true", "false"] }
      responses:
        "200":
          description: One page of completed extractions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtractionList" }
        "400": { $ref: "#/components/responses/InvalidBody" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      description: Register one completed extraction from a matching confirmed publication intent, or replay identical content.
      operationId: registerExtraction
      security: [{ workerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtractionRegistration" }
      responses:
        "200":
          description: Extraction accepted or identically replayed.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/ExtractionRegistrationResult" }
        "400": { $ref: "#/components/responses/InvalidBody" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/extractions/{extraction_id}:
    get:
      description: Return one completed extraction, its trajectory reference, and its optional observation.
      operationId: getExtraction
      security: [{ catalogToken: [] }]
      parameters:
        - in: path
          name: extraction_id
          required: true
          schema: { $ref: "#/components/schemas/ExtractionId" }
      responses:
        "200":
          description: The requested extraction.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtractionRecord" }
        "400": { $ref: "#/components/responses/InvalidBody" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/observation-backlog:
    get:
      description: Summarize observations that have not yet been consumed by a memory version.
      operationId: getObservationBacklog
      security: [{ catalogToken: [] }]
      responses:
        "200":
          description: Pending observation count and age.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObservationBacklog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/observations:
    get:
      description: List observations newest first with stable cursor pagination and processing filters.
      operationId: listObservations
      security: [{ catalogToken: [] }]
      parameters:
        - in: query
          name: cursor
          required: false
          schema: { type: string, minLength: 1 }
        - in: query
          name: limit
          required: false
          schema: { type: string, pattern: "^(?:[1-9]|[1-9][0-9]|100)$" }
        - in: query
          name: status
          required: false
          schema: { type: string, enum: [pending, consumed] }
        - in: query
          name: consumed_version
          required: false
          schema: { type: string, pattern: "^[1-9][0-9]*$" }
      responses:
        "200":
          description: One page of observations and their consumption state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObservationList" }
        "400": { $ref: "#/components/responses/InvalidBody" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/overview:
    get:
      description: Summarize completed extraction coverage, observation outcomes, and a selectable trend range. All-time trends are aggregated by month; bounded trends are aggregated by day.
      operationId: getCatalogOverview
      security: [{ catalogToken: [] }]
      parameters:
        - in: query
          name: range
          required: false
          schema:
            type: string
            enum: [30d, 90d, all]
            default: 30d
      responses:
        "200":
          description: Aggregate Memory Catalog statistics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogOverview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/learning-input:
    get:
      description: Return a bounded observation set and the active memory state it must be maintained against.
      operationId: getLearningInput
      security: [{ workerToken: [] }]
      parameters:
        - in: query
          name: limit
          required: true
          schema: { type: string, pattern: "^(?:[1-9]|[1-9][0-9]|100)$" }
      responses:
        "200":
          description: Current memory state and bounded pending observations, or null when none are pending.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningInputResult" }
        "400": { $ref: "#/components/responses/InvalidBody" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/memory-tree/versions:
    post:
      description: Select a matching confirmed publication intent, create its immutable version with compare-and-swap, and consume any source observations.
      operationId: createMemoryTreeVersion
      security: [{ catalogToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryTreeVersionCreation" }
      responses:
        "201":
          description: The version was created.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                {
                  $ref: "#/components/schemas/MemoryTreeVersionCreationResult",
                }
        "200":
          description: An identical version submission had already created this version.
          content:
            application/json:
              schema:
                {
