openapi: 3.1.0
info:
  title: Memory Catalog API
  version: v1
  description: |
    Hand-maintained single source of truth for the managed-memory catalog HTTP
    boundary. Service implementations and generated types consume this document;
    service code does not generate it.
x-contract-source: hand-maintained
components:
  securitySchemes:
    catalogToken:
      type: http
      scheme: bearer
  schemas:
    ArtifactReference:
      type: object
      additionalProperties: false
      required: [uri, digest, media_type, size_bytes]
      properties:
        uri:
          type: string
          pattern: ^s3://
        digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        media_type:
          type: string
          minLength: 1
        size_bytes:
          type: integer
          minimum: 0
    ObservationRegistration:
      type: object
      additionalProperties: false
      required:
        - observation_id
        - source_workflow
        - source_run_id
        - source_review_unit_id
        - transcript_digest
        - body_markdown
        - audit_reference
      properties:
        observation_id: { type: string, minLength: 1 }
        source_workflow: { type: string, minLength: 1 }
        source_run_id: { type: string, minLength: 1 }
        source_review_unit_id: { type: string, minLength: 1 }
        transcript_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        body_markdown: { type: string, minLength: 1 }
        audit_reference:
          $ref: '#/components/schemas/ArtifactReference'
    ObservationRegistrationResult:
      type: object
      additionalProperties: false
      required: [ok, created]
      properties:
        ok: { type: boolean, const: true }
        created: { type: boolean }
    PendingObservationSummary:
      type: object
      additionalProperties: false
      required: [pending_count, oldest_pending_created_at]
      properties:
        pending_count: { type: integer, minimum: 0 }
        oldest_pending_created_at:
          type: [string, 'null']
          format: date-time
    MaintenanceBatchSelection:
      type: object
      additionalProperties: false
      required: [limit]
      properties:
        limit: { type: integer, minimum: 1, maximum: 100 }
    MaintenanceObservation:
      type: object
      additionalProperties: false
      required: [observation_id, body_markdown]
      properties:
        observation_id: { type: string, minLength: 1 }
        body_markdown: { type: string, minLength: 1 }
    MaintenanceBatch:
      type: object
      additionalProperties: false
      required: [base_revision, active_memory, observations]
      properties:
        base_revision: { type: integer, minimum: 0 }
        active_memory:
          oneOf:
            - $ref: '#/components/schemas/ArtifactReference'
            - type: 'null'
        observations:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MaintenanceObservation'
    MaintenanceBatchResult:
      type: object
      additionalProperties: false
      required: [batch]
      properties:
        batch:
          oneOf:
            - $ref: '#/components/schemas/MaintenanceBatch'
            - type: 'null'
    MaintenanceCompletion:
      type: object
      additionalProperties: false
      required: [base_revision, observation_ids, memory_version, audit_reference]
      properties:
        base_revision: { type: integer, minimum: 0 }
        observation_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, minLength: 1 }
        memory_version:
          $ref: '#/components/schemas/ArtifactReference'
        audit_reference:
          $ref: '#/components/schemas/ArtifactReference'
    MaintenanceCompletionResult:
      type: object
      additionalProperties: false
      required: [completed]
      properties:
        completed: { type: boolean }
    ActiveVersion:
      type: object
      additionalProperties: false
      required: [revision, artifact_reference]
      properties:
        revision: { type: integer, minimum: 0 }
        artifact_reference:
          oneOf:
            - $ref: '#/components/schemas/ArtifactReference'
            - type: 'null'
    MemoryRevision:
      type: object
      additionalProperties: false
      required:
        - revision
        - artifact_reference
        - maintenance_audit_reference
        - created_at
      properties:
        revision: { type: integer, minimum: 1 }
        artifact_reference:
          $ref: '#/components/schemas/ArtifactReference'
        maintenance_audit_reference:
          $ref: '#/components/schemas/ArtifactReference'
        created_at:
          type: string
          format: date-time
    MemoryRevisionList:
      type: object
      additionalProperties: false
      required: [revisions, next_before_revision]
      properties:
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/MemoryRevision'
        next_before_revision:
          type: [integer, 'null']
          minimum: 1
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: ok }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string }
        code:
          type: string
          enum: [INVALID_BODY, UNAUTHORIZED, NOT_FOUND, CONFLICT, INTERNAL_ERROR]
  responses:
    InvalidBody:
      description: The JSON body does not match the operation schema.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing or invalid catalog bearer token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: The observation identity already exists with different content.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: The requested catalog record does not exist.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: Opaque internal server error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PayloadTooLarge:
      description: The request body exceeds the service limit.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
paths:
  /healthz:
    get:
      description: Report whether the Memory Catalog process is serving requests.
      operationId: health
      security: []
      responses:
        '200':
          description: Service is running.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/observations:
    post:
      description: Register one durable memory observation or replay an identical registration.
      operationId: registerObservation
      security: [{ catalogToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ObservationRegistration' }
      responses:
        '200':
          description: Observation accepted or identically replayed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObservationRegistrationResult' }
        '400': { $ref: '#/components/responses/InvalidBody' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/observations/pending-summary:
    get:
      description: Summarize observations that have not yet entered a memory version.
      operationId: pendingObservationSummary
      security: [{ catalogToken: [] }]
      responses:
        '200':
          description: Pending observation count and age.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingObservationSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/maintenance/batches/select:
    post:
      description: Select a bounded observation batch against the current memory revision.
      operationId: selectMaintenanceBatch
      security: [{ catalogToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenanceBatchSelection' }
      responses:
        '200':
          description: Current revision and one pending observation batch.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceBatchResult' }
        '400': { $ref: '#/components/responses/InvalidBody' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/maintenance/complete:
    post:
      description: Atomically publish a memory version and consume its source observations.
      operationId: completeMaintenance
      security: [{ catalogToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenanceCompletion' }
      responses:
        '200':
          description: Whether the revision CAS and observation consumption committed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceCompletionResult' }
        '400': { $ref: '#/components/responses/InvalidBody' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/active-version:
    get:
      description: Return the currently active immutable memory version, if one exists.
      operationId: activeVersion
      security: [{ catalogToken: [] }]
      responses:
        '200':
          description: Current active immutable memory version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActiveVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/revisions:
    get:
      description: List immutable memory revisions in descending revision order.
      operationId: listRevisions
      security: [{ catalogToken: [] }]
      parameters:
        - in: query
          name: before_revision
          required: false
          schema: { type: string, pattern: '^[1-9][0-9]*$' }
        - in: query
          name: limit
          required: false
          schema: { type: string, pattern: '^[1-9][0-9]*$' }
      responses:
        '200':
          description: One page of immutable memory revision history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryRevisionList' }
        '400': { $ref: '#/components/responses/InvalidBody' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/revisions/{revision}:
    get:
      description: Return one immutable memory revision and its maintenance audit.
      operationId: getRevision
      security: [{ catalogToken: [] }]
      parameters:
        - in: path
          name: revision
          required: true
          schema: { type: string, pattern: '^[1-9][0-9]*$' }
      responses:
        '200':
          description: The requested immutable memory revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryRevision' }
        '400': { $ref: '#/components/responses/InvalidBody' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
