openapi: 3.1.0
info:
  title: Control Plane
  version: v1
  description: |
    Control Plane coordination API. The read surface (runs listing/detail) is
    consumed by the console; the write surface (admission, submission, publication)
    and the internal full reads are consumed by the GitHub integration. This document
    is the single source of truth: routes, validation, and client types are all derived
    from it.
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      description: Mutation and internal full-read access (GitHub integration).
    readToken:
      type: http
      scheme: bearer
      description: Redacted read access (console).
  responses:
    InvalidRequest:
      description: >-
        The request failed the contract's own schema. `code` names which part —
        `INVALID_QUERY`, `INVALID_BODY`, or `INVALID_PATH_PARAMETER`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid bearer credential for the operation's security scheme.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RunNotFound:
      description: The referenced run was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    DeterministicPublicationFailure:
      description: >-
        A deterministic publication failure; `code` carries the terminal reason
        (`PUBLICATION_STEP_*`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: >-
        The request body exceeded the service's limit (1 MiB). Only operations that read a body
        can return this; the body is rejected before the contract's own schema sees it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: >-
        An internal fault. The response is deliberately opaque (it never carries the fault's
        message or `code`); the identity is logged server-side. Every operation can return it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        code:
          type: string
          description: |
            The machine-readable reason. `INVALID_QUERY`, `INVALID_BODY`, and
            `INVALID_PATH_PARAMETER` identify which part of the request failed schema
            validation; the `PUBLICATION_STEP_*` codes are terminal publication failures.
          enum:
            - INVALID_QUERY
            - INVALID_BODY
            - INVALID_PATH_PARAMETER
            - PUBLICATION_STEP_SET_DUPLICATE
            - PUBLICATION_STEP_SET_CHANGED
            - PUBLICATION_STEP_RETRY_EXHAUSTED
            - PUBLICATION_STEP_NOT_CLAIMABLE
    ReviewRunRecord:
      type: object
      additionalProperties: false
      required:
        - run_id
        - workflow
        - publish_context
        - preparation
        - runner_status
        - submitted_at
        - publication_status
        - created_at
        - execution_updated_at
        - publication_updated_at
        - published_at
        - failure_code
        - failure_message
        - artifact_storage
      properties:
        run_id:
          type: string
          minLength: 1
        workflow:
          type: string
          enum:
            - issue-review
            - pull-request-review
            - repository-review
        publish_context:
          type: object
          additionalProperties: {}
        runner_input:
          type: object
          additionalProperties: {}
        preparation:
          $ref: "#/components/schemas/PreparationSummary"
        ingress_kind:
          type: string
          enum:
            - github_webhook
            - github_actions_dispatch
        ingress_key:
          type: string
        runner_status:
          type: string
          enum:
            - pending
            - queued
            - running
            - uncertain
            - succeeded
            - skipped
            - failed
        submitted_at:
          type:
            - string
            - "null"
          format: date-time
          description: >-
            Immutable instant execution began (the prepared input was accepted and the run
            entered queued). NULL while the run is still preparing; use it, not
            execution_updated_at, to time execution.
        publication_status:
          type: string
          enum:
            - pending
            - publishing
            - published
            - failed
            - skipped
        created_at:
          type: string
          format: date-time
        execution_updated_at:
          type: string
          format: date-time
        publication_updated_at:
          type: string
          format: date-time
        published_at:
          type:
            - string
            - "null"
          format: date-time
        failure_code:
          type:
            - string
            - "null"
        failure_message:
          type:
            - string
            - "null"
        artifact_storage:
          $ref: "#/components/schemas/ArtifactStorage"
    ReviewRunAdmission:
      type: object
      additionalProperties: false
      required:
        - record
        - created
        - preparation_token
      properties:
        record:
          $ref: "#/components/schemas/ReviewRunRecord"
        created:
          type: boolean
        preparation_token:
          type:
            - string
            - "null"
    PreparationWork:
      type: object
      additionalProperties: false
      required:
        - run_id
        - workflow
        - input_version
        - input
        - claim_token
        - attempt_count
      properties:
        run_id:
          type: string
          minLength: 1
        workflow:
          type: string
          enum:
            - issue-review
            - pull-request-review
            - repository-review
        input_version:
          type: string
          minLength: 1
        input:
          type: object
          additionalProperties: {}
        claim_token:
          type: string
          minLength: 1
        attempt_count:
          type: integer
          minimum: 1
    PreparationFailureNoticeWork:
      type: object
      additionalProperties: false
      required:
        - run_id
        - input
        - failure_code
        - claim_token
      properties:
        run_id:
          type: string
          minLength: 1
        input:
          type: object
          additionalProperties: {}
        failure_code:
          type:
            - string
            - "null"
        claim_token:
          type: string
          minLength: 1
    PublicationWork:
      type: object
      additionalProperties: false
      required:
        - run_id
        - workflow
        - publish_context
        - runner_status
        - submitted_at
        - publication_status
        - created_at
        - execution_updated_at
        - publication_updated_at
        - published_at
        - failure_code
        - failure_message
        - artifact_storage
        - workflow_result
        - claim_token
      properties:
        run_id:
          type: string
          minLength: 1
        workflow:
          type: string
          enum:
            - issue-review
            - pull-request-review
            - repository-review
        publish_context:
          type: object
          additionalProperties: {}
        runner_input:
          type: object
          additionalProperties: {}
        ingress_kind:
          type: string
          enum:
            - github_webhook
            - github_actions_dispatch
        ingress_key:
          type: string
        runner_status:
          type: string
          enum:
            - pending
            - queued
            - running
            - uncertain
            - succeeded
            - skipped
            - failed
        submitted_at:
          type:
            - string
            - "null"
          format: date-time
          description: >-
            Immutable instant execution began (the prepared input was accepted and the run
            entered queued). NULL while the run is still preparing; use it, not
            execution_updated_at, to time execution.
        publication_status:
          type: string
          enum:
            - pending
            - publishing
            - published
            - failed
            - skipped
        created_at:
          type: string
          format: date-time
        execution_updated_at:
          type: string
          format: date-time
        publication_updated_at:
          type: string
          format: date-time
        published_at:
          type:
            - string
            - "null"
          format: date-time
        failure_code:
          type:
            - string
            - "null"
        failure_message:
          type:
            - string
            - "null"
        artifact_storage:
          $ref: "#/components/schemas/ArtifactStorage"
        workflow_result: {}
        claim_token:
          type: string
          minLength: 1
    PublicationStepRecord:
      type: object
      additionalProperties: false
      required:
        - step_key
        - status
        - failure_count
        - remote_object_id
        - remote_object_url
        - failure_code
        - failure_message
      properties:
        step_key:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - pending
            - running
            - succeeded
            - failed
            - terminal_failed
        failure_count:
          type: integer
          minimum: 0
        remote_object_id:
          type:
            - string
            - "null"
        remote_object_url:
          type:
            - string
            - "null"
          format: uri
        failure_code:
          type:
            - string
            - "null"
        failure_message:
          type:
            - string
            - "null"
    ObservedPublicationStep:
      type: object
      additionalProperties: false
      required:
        - step_key
        - status
        - failure_count
        - remote_object_url
        - failure_code
        - failure_message
      properties:
        step_key:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - pending
            - running
            - succeeded
            - failed
            - terminal_failed
        failure_count:
          type: integer
          minimum: 0
        remote_object_url:
          type:
            - string
            - "null"
          format: uri
        failure_code:
          type:
            - string
            - "null"
        failure_message:
          type:
            - string
            - "null"
    ObservedRun:
      type: object
      additionalProperties: false
      required:
        - run_id
        - workflow
        - preparation
        - execution_status
        - submitted_at
        - publication_status
        - created_at
        - execution_updated_at
        - publication_updated_at
        - published_at
        - failure_code
        - artifact_storage
      properties:
        run_id:
          type: string
          minLength: 1
        workflow:
          type: string
          enum:
            - issue-review
            - pull-request-review
            - repository-review
        preparation:
          $ref: "#/components/schemas/PreparationSummary"
        execution_status:
          type: string
          description: >-
            The Runner lifecycle, retained under its established public name. `pending` means
            the run has been admitted but its prepared input has not yet been submitted to the
            Runner; preparation progress is reported separately by `preparation`. `skipped`
            means execution never ran because preparation failed; the reason is on
            `preparation`, not here. `uncertain` means a submission may have reached the Runner
            but its result could not be confirmed; a recovery replays it to resolve the run to
            `queued` or `failed`, so it is not a failure.
          enum:
            - pending
            - queued
            - running
            - uncertain
            - succeeded
            - skipped
            - failed
        submitted_at:
          type:
            - string
            - "null"
          format: date-time
          description: >-
            Immutable instant execution began (the prepared input was accepted and the run
            entered queued). NULL while the run is still preparing; use it, not
            execution_updated_at, to time execution.
        publication_status:
          type: string
          enum:
            - pending
            - publishing
            - published
            - failed
            - skipped
        created_at:
          type: string
          format: date-time
        execution_updated_at:
          type: string
          format: date-time
        publication_updated_at:
          type: string
          format: date-time
        published_at:
          type:
            - string
            - "null"
          format: date-time
        failure_code:
          type:
            - string
            - "null"
        artifact_storage:
          $ref: "#/components/schemas/ArtifactStorage"
    ReviewRunEvent:
      type: object
      additionalProperties: false
      required:
        - event_id
        - axis
        - from_status
        - to_status
        - reason_code
        - occurred_at
      properties:
        event_id:
          type: integer
          description: Monotonic identifier; also the tie-breaker within one occurred_at.
        axis:
          type: string
          enum:
            - runner
            - preparation
            - publication
            - notice
        from_status:
          type:
            - string
            - "null"
          description: State before the transition; null for the first event on an axis.
        to_status:
          type: string
        reason_code:
          type:
            - string
            - "null"
          description: Machine-readable cause for a failure or reversion, when there is one.
        occurred_at:
          type: string
          format: date-time
    PreparationSummary:
      type:
        - object
        - "null"
      description: >-
        Durable preparation state, when the run has a preparation record. This is
        an operational summary only; it never exposes connector-owned preparation input.
      additionalProperties: false
      required:
        - status
        - attempt_count
        - updated_at
        - failure_code
        - failure_notice_status
      properties:
        status:
          type: string
          description: >-
            Preparation lifecycle. `preparing` means a preparer currently owns the claim;
            it is the preparation axis's own "in progress" state and is unrelated to the
            Runner, which is only submitted to once preparation reaches `submitted`.
          enum:
            - pending
            - preparing
            - submitted
            - failed
        attempt_count:
          type: integer
          minimum: 0
        updated_at:
          type: string
          format: date-time
        failure_code:
          type:
            - string
            - "null"
        failure_notice_status:
          type:
            - string
            - "null"
          enum:
            - pending
            - delivering
            - delivered
            - skipped
            - null
    ArtifactStorage:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - status
          properties:
            status:
              type: string
              enum:
                - unavailable
                - failed
            error_code:
              type: string
            message:
              type: string
        - type: object
          additionalProperties: false
          required:
            - status
            - artifact
          properties:
            status:
              type: string
              enum:
                - available
            artifact:
              type: object
              additionalProperties: false
              required:
                - kind
                - uri
                - media_type
                - digest
                - size_bytes
              properties:
                kind:
                  type: string
                  enum:
                    - diagnostic_bundle
                uri:
                  type: string
                  pattern: ^s3://sec-review/runs/[^/]+/artifacts/diagnostic-tree\.v1\.tar\.zst$
                media_type:
                  type: string
                  enum:
                    - application/tar+zstd
                digest:
                  type: string
                  pattern: ^sha256:[0-9a-f]{64}$
                size_bytes:
                  type: integer
                  minimum: 0
        - type: "null"

# State machine definitions. These are the single source of truth for the coordination
# lifecycles: the console renders its state-machine and history views from a module generated
# out of this block, and a test asserts every state here is an enum value on the corresponding
# schema (and vice versa), so the diagram and the contract cannot drift apart. They are not part
# of the HTTP surface; they describe the transitions the write paths perform.
x-state-machines:
  preparation:
    order: 1
    title: Preparation
    # Which observed field carries this axis' current state.
    field: preparation.status
    initial: pending
    terminal: [submitted, failed]
    states:
      pending:
        label: Pending
        description: Admitted, but no preparer has claimed the work yet.
      preparing:
        label: Preparing
        description: A coordinator currently owns the claim and is building the Runner input.
      submitted:
        label: Submitted
        description: The input was accepted and handed to the Runner; preparation is done.
      failed:
        label: Failed
        description: >-
          Preparation failed permanently (retry budget exhausted or input could not be built).
          The Runner was never handed input, so execution is skipped.
    transitions:
      - { from: pending, to: preparing, label: claimed}
      - { from: preparing, to: submitted, label: input accepted}
      - { from: preparing, to: pending, label: retry}
      - { from: preparing, to: failed, reason: PREPARATION_RETRY_EXHAUSTED, label: retry exhausted}
  runner:
    order: 2
    title: Execution
    field: execution_status
    initial: pending
    terminal: [succeeded, skipped, failed]
    states:
      pending:
        label: Pending
        description: Admitted, but its prepared input has not been submitted to the Runner yet.
      queued:
        label: Queued
        description: The Runner accepted the submission; polling has not yet seen it start.
      running:
        label: Running
        description: >-
          Polling observed that the Runner is executing this run. A transient network blip while
          polling does not change this state: the run keeps the last observed value and is polled
          again, so this state may be slightly out of date.
      succeeded:
        label: Succeeded
        description: The Runner returned a result; it now becomes eligible for publication.
      skipped:
        label: Skipped
        description: >-
          Execution never ran because preparation failed. This is not an execution failure; the
          reason is on the preparation axis.
      uncertain:
        label: Unconfirmed
        description: >-
          The task was submitted, but no response arrived, so it is unknown whether the Runner
          accepted it. This is not a failure: the submission is replayed under the same run_id,
          and the run becomes queued if accepted or failed if it keeps failing.
      failed:
        label: Failed
        description: >-
          A definite failure, in one of two ways: (1) polling produced a conclusive answer that
          the task cannot succeed — the Runner reported it failed, or the run could not be found,
          returned no result, or the response broke the protocol; (2) a retried submission failed
          conclusively. A transient network error (a timeout, a 5xx, a dropped connection) is not
          a definite failure.
    transitions:
      # Submission (a write). `uncertain` only ever comes from a submission whose acceptance
      # could not be confirmed — never from a run that was already queued or running.
      - { from: pending, to: queued, label: input submitted}
      - { from: pending, to: skipped, label: preparation failed}
      - { from: pending, to: uncertain, reason: SUBMISSION_STATE_UNCERTAIN, label: submission unconfirmed }
      - { from: uncertain, to: queued, label: replay accepted}
      - { from: uncertain, to: failed, label: replay rejected }
      # Observation (a read): the console learns the Runner's progress by polling.
      - { from: queued, to: running, label: runner started }
      - { from: running, to: succeeded, label: runner succeeded }
      - { from: queued, to: failed, label: polling concluded failure }
      - { from: running, to: failed, label: polling concluded failure }
  publication:
    order: 3
    title: Publication
    field: publication_status
    initial: pending
    terminal: [published, failed, skipped]
    states:
      pending:
        label: Pending
        description: Waiting for a successful execution result before publishing.
      publishing:
        label: Publishing
        description: A coordinator owns the publication claim and is performing the side effects.
      published:
        label: Published
        description: All publication steps succeeded; the result is visible.
      failed:
        label: Failed
        description: The publication failed after its retry budget was exhausted.
      skipped:
        label: Skipped
        description: There was nothing to publish because execution did not succeed.
    transitions:
      - { from: pending, to: publishing, label: publishing started }
      - { from: publishing, to: published, label: published }
      - { from: publishing, to: pending, label: retryable failure }
      - { from: publishing, to: failed, label: terminal failure}
      - { from: pending, to: skipped, label: execution not published}
  # The failure-notice outbox has its own lifecycle, written to the event log on the `notice`
  # axis. It is declared like any other state machine so the contract-consistency test covers its
  # states against `PreparationSummary.failure_notice_status`. Whether the console draws it is a
  # presentation decision and lives in the console, not here.
  notice:
    order: 4
    title: Failure notice
    field: preparation.failure_notice_status
    initial: pending
    terminal: [delivered, skipped]
    states:
      pending:
        label: Pending
        description: A terminal preparation failure happened and the user still has to be told.
      delivering:
        label: Delivering
        description: The failure notice is being delivered to the user.
      delivered:
        label: Delivered
        description: The user-visible failure notice was delivered.
      skipped:
        label: Skipped
        description: No notice will be delivered for this failure.
    transitions:
      - { from: pending, to: delivering, label: notice claimed }
      - { from: delivering, to: delivering, reason: NOTICE_LEASE_EXPIRED, label: delivery lease expired }
      - { from: delivering, to: delivered, label: notice delivered }
      - { from: delivering, to: skipped, label: notice skipped }

paths:
  /healthz:
    get:
      operationId: getHealth
      description: >-
        Report process health. Requires no credential.
      # Explicitly public: the liveness probe must answer an unauthenticated caller. The empty
      # requirement is what says so; omitting the key would be indistinguishable from a
      # forgotten requirement, which the `operation-requires-security` rule rejects.
      security: []
      responses:
        "200":
          description: Process health.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
        "500":
          $ref: "#/components/responses/InternalError"
  /readyz:
    get:
      operationId: getReadiness
      description: >-
        Report whether this instance can safely accept coordination requests. Requires no credential.
      security: []
      responses:
        "200":
          description: PostgreSQL is reachable through the pool and the startup schema is present.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
        "503":
          description: PostgreSQL, the connection pool, or the applied startup schema is unavailable.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - unavailable
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/runs:
    get:
      operationId: listRuns
      description: >-
        List runs for the caller's connector, newest first, with cursor pagination. Returns the
        redacted observed shape; internal inputs and publish context are omitted.
      security:
        - readToken: []
      parameters:
        # The filters are one `form`-exploded object rather than seven separate parameters
        # so the route schema can say `additionalProperties: false`: an unknown query
        # parameter is rejected (400 `INVALID_QUERY`) instead of being ignored, matching how
        # the request bodies already refuse undeclared fields. When the parameters are
        # separate there is no place to attach `additionalProperties`, so the contract would
        # overstate the validation. The name below is only a schema holder; the client sends
        # the properties themselves (`?limit=…&workflow=…`).
        - in: query
          name: filter
          style: form
          explode: true
          description: >-
            The list filters. Each declared property is a query parameter of the same name;
            any other query parameter is rejected.
          schema:
            type: object
            additionalProperties: false
            properties:
              limit:
                type: integer
                minimum: 1
                maximum: 100
              cursor:
                type: string
              execution_status:
                type: string
                enum:
                  - pending
                  - queued
                  - running
                  - uncertain
                  - succeeded
                  - skipped
                  - failed
              publication_status:
                type: string
                enum:
                  - pending
                  - publishing
                  - published
                  - failed
                  - skipped
              preparation_status:
                type: string
                description: >-
                  Matches the run's redacted preparation summary by state. Runs without a
                  preparation record are not returned by this filter.
                enum:
                  - pending
                  - preparing
                  - submitted
                  - failed
              workflow:
                type: string
                enum:
                  - issue-review
                  - pull-request-review
                  - repository-review
              from:
                type: string
                format: date-time
              to:
                type: string
                format: date-time
      responses:
        "200":
          description: Paginated redacted runs.
          content:
            application/json:
              schema:
                type: object
                required:
                  - runs
                  - next_cursor
                properties:
                  runs:
                    type: array
                    items:
                      $ref: "#/components/schemas/ObservedRun"
                  next_cursor:
                    type:
                      - string
                      - "null"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: admitRun
      description: >-
        Admit a review run, assigning its `run_id` before input preparation begins. Re-admitting
        the same `ingress_kind`/`ingress_key` returns the original run instead of creating another.
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - workflow
                - publish_context
                - preparation_input_version
                - preparation_input
                - ingress_kind
                - ingress_key
              properties:
                workflow:
                  type: string
                  enum:
                    - issue-review
                    - pull-request-review
                    - repository-review
                publish_context:
                  type: object
                  additionalProperties: {}
                runner_input:
                  type: object
                  additionalProperties: {}
                preparation_input_version:
                  type: string
                  minLength: 1
                preparation_input:
                  type: object
                  additionalProperties: {}
                ingress_kind:
                  type: string
                  enum:
                    - github_webhook
                    - github_actions_dispatch
                ingress_key:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: The admitted (or re-admitted) run.
          content:
