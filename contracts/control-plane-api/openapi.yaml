  /v1/runs/parked:
    get:
      operationId: listParkedRuns
      description: >-
        List the runs whose automatic work stopped without a conclusion, on any axis.
        Coordination stops retrying these, so this is the queue of runs that need an operator
        decision, and `axis` says which part of the run stopped. Reading it needs only the read
        token: knowing that a run is stuck is not a privileged act, and the console should be
        able to show it without holding operator credentials.
      security:
        - readToken: []
      responses:
        "200":
          description: Parked runs, oldest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - blocks
                properties:
                  blocks:
                    type: array
                    items:
                      $ref: "#/components/schemas/ParkedRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/runs/{runId}/abandon:
    post:
      operationId: abandonBlockedPreparation
      description: >-
        An operator decision, not a repair: conclude a blocked run's open axes so it stops
        holding unwinnable work. Execution is left untouched (a recorded result and its
        `workflow_result` stay), nothing is deleted, and the run keeps its ingress identity so a
        replay still resolves to it. Only a run whose preparation is parked by a contradiction
        is eligible - the case this decision exists for; a run parked on execution or publication
        is ended with `giveUp` instead. That single-eligibility restriction is what keeps this
        from becoming a general state-jumping endpoint: the route can only finish a transition
        coordination already proved impossible, and a leaked admin token can at most conclude
        such a run. Requires the admin token; the route does not exist when none is configured.
      security:
        - adminToken: []
      parameters:
        - in: path
          name: runId
          required: true
          description: The run identifier Control Plane assigned at admission (a UUID).
          schema:
            type: string
            pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - reason
              properties:
                reason:
                  type: string
                  minLength: 1
                  description: Why this run is being abandoned; recorded on every event it writes.
      responses:
        "200":
          description: The run after its open axes were concluded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewRunRecord"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/RunNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/runs/{runId}/give-up:
    post:
      operationId: giveUpDisconnectedRun
      description: >-
        An operator decision that stops waiting for a disconnected run instead of resuming it.
        It never claims that nothing happened: a disconnected execution may already have been
        accepted by the Runner, and a disconnected publication may already have delivered some of
        its steps. The decision is therefore recorded as "this outcome will not be waited for":
        the disconnected axis ends as failed with a reason naming the operator, and whatever the
        run would still have produced is not published. A disconnected preparation concludes as a
        failure, an execution in flight is stopped, and a publication is skipped.
        Only a run with a disconnected axis is eligible, and a reason is required so the decision
        is never anonymous. Requires the admin token; the route does not exist when none is
        configured.
      security:
        - adminToken: []
      parameters:
        - in: path
          name: runId
          required: true
          description: The run identifier Control Plane assigned at admission (a UUID).
          schema:
            type: string
            pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - reason
              properties:
                reason:
                  type: string
                  minLength: 1
                  description: Why this outcome is being given up on; recorded on every event it writes.
      responses:
        "200":
          description: The run after the decision concluded its disconnected axis.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewRunRecord"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/RunNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/runs/{runId}/resume:
    post:
      operationId: resumeDisconnectedRun
      description: >-
        An operator decision that hands a disconnected run back to automatic recovery.
        Exactly one axis can be `disconnected` at a time, and this resumes whichever it is.
        A disconnected preparation returns to `uncertain` and its attempt budget is reset,
        because such a row has always spent that budget and would otherwise be concluded as
        failed by the next command without ever being attempted again. A disconnected execution
        returns to `uncertain` with its replay budget reset, for the same reason: the replays
        stopped precisely because that budget was spent. A disconnected publication returns to
        the normal claim queue: its parked steps become attemptable with both budgets reset, so the
        side effects they name are issued once more. Steps that already succeeded are not reset -
        the run resumes where it stopped instead of starting over. Nothing is repaired and no
        outcome is asserted either way.
        The decision is the operator's, and it is not capped: every resume is recorded as its own
        `PUBLICATION_RESUMED_BY_OPERATOR` transition, so the exercise of that authority is
        visible after the fact rather than limited in advance. Only a run with a disconnected
        axis is eligible, so a leaked admin token can at most restart work the system already
        stopped by itself. Requires the admin token; the route does not exist when none is
        configured.
      security:
        - adminToken: []
      parameters:
        - in: path
          name: runId
          required: true
          description: The run identifier Control Plane assigned at admission (a UUID).
          schema:
            type: string
            pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      responses:
        "200":
          description: The run after its disconnected axis was handed back to automatic recovery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewRunRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/RunNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/config/preparation-heartbeat-interval:
    get:
      operationId: getPreparationHeartbeatInterval
