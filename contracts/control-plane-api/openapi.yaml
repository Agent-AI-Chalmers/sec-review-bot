  /v1/runs/{runId}/preparation/failure:
    post:
      operationId: failPreparation
      description: >-
        Record a preparation failure for a run the caller still owns. A retryable
        failure remains preparing and becomes claimable after the requested delay;
        the finite Control Plane retry budget turns exhaustion into a terminal failure.
      security:
        - serviceToken: []
      parameters:
        - in: path
          name: runId
          required: true
          description: The run identifier Control Plane assigned at admission (a UUID).
          schema:
            type: string
            pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - token
                - failure
              properties:
                token:
                  type: string
                  minLength: 1
                failure:
                  type: object
                  additionalProperties: false
                  required:
                    - message
                  properties:
                    code:
                      type:
                        - string
                        - "null"
                    message:
                      type: string
                retry:
                  type: boolean
                  default: false
                retry_after_ms:
                  type: integer
                  minimum: 0
                  description: Delay before the durable preparation is claimable again.
      responses:
        "200":
          description: The preparation failure outcome.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - retry_scheduled
                properties:
                  retry_scheduled:
                    type: boolean
                    description: False when the failure is terminal or exhausted its retry budget.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
