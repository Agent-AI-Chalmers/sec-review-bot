  /v1/runs/{runId}/publication/steps/{stepKey}/settle-exhausted:
    post:
      operationId: settleExhaustedPublicationStep
      description: >-
        Conclude a publication step that has no attempts left, from what the connector found on the
        remote system. Exhaustion alone never concludes a step: an attempt that started may have
        taken effect remotely before its owner died or its response was lost, and Control Plane
        cannot see that system. The connector therefore reports either the effect it found (the
        step becomes succeeded, using the same remote reference a live completion would have
        written) or that it looked and found nothing (only then does the step become
        terminal_failed). The caller must still own the publication claim.
      security:
        - serviceToken: []
      parameters:
        - in: path
          name: runId
          required: true
          description: The run identifier Control Plane assigned at admission (a UUID).
          schema:
            type: string
            pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        - in: path
          name: stepKey
          required: true
          description: The publication step key, as supplied at initializePublicationSteps.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - token
                - found
              properties:
                token:
                  type: string
                  minLength: 1
                found:
                  description: >-
                    Whether the connector found the side effect already present on the remote
                    system. `false` means the connector looked and confirmed it is absent.
                  type: boolean
                remote_object:
                  description: >-
                    The remote object the connector matched when `found` is true; ignored
                    otherwise.
                  type: object
                  additionalProperties: false
                  properties:
                    id:
                      type:
                        - string
                        - "null"
                    url:
                      type:
                        - string
                        - "null"
      responses:
        "200":
          description: Whether this call concluded the step.
          content:
            application/json:
              schema:
                type: boolean
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
