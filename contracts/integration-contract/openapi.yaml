components:
  schemas:
    CreateRunRequest:
      description: A request to start one workflow run.
      properties:
        input:
          additionalProperties: true
          title: Input
          type: object
        run_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$
          title: Run Id
          type: string
        runtime:
          anyOf:
            - additionalProperties: true
              type: object
            - type: "null"
          title: Runtime
      required:
        - run_id
        - input
      title: CreateRunRequest
      type: object
    ExecutionArtifactStorage:
      description: |-
        Where a terminal run's diagnostics went, or why they are not there.

        The Execution API provider only attaches this once a run reaches a terminal state, and reports a failed
        upload as a status rather than an error, because storage is diagnostic metadata and not
        the business result.
      properties:
        artifact:
          anyOf:
            - $ref: "#/components/schemas/ExecutionDiagnosticArtifact"
            - type: "null"
        error_code:
          anyOf:
            - type: string
            - type: "null"
          title: Error Code
        message:
          anyOf:
            - type: string
            - type: "null"
          title: Message
        status:
          enum:
            - available
            - unavailable
            - failed
          title: Status
          type: string
      required:
        - status
      title: ExecutionArtifactStorage
      type: object
    ExecutionDiagnosticArtifact:
      description: The Execution's public projection of one stored diagnostic bundle.
      properties:
        digest:
          title: Digest
          type: string
        kind:
          const: diagnostic_bundle
          title: Kind
          type: string
        media_type:
          title: Media Type
          type: string
        size_bytes:
          title: Size Bytes
          type: integer
        uri:
          title: Uri
          type: string
      required:
        - kind
        - uri
        - media_type
        - digest
        - size_bytes
      title: ExecutionDiagnosticArtifact
      type: object
    ExecutionError:
      description: The envelope every execution error carries.
      properties:
        category:
          enum:
            - input
            - workflow
            - llm
            - runtime
            - internal
          title: Category
          type: string
        code:
          description: Stable machine-readable error code.
          title: Code
          type: string
        details:
          additionalProperties: true
          title: Details
          type: object
        message:
          title: Message
          type: string
        retryable:
          title: Retryable
          type: boolean
      required:
        - category
        - code
        - message
        - retryable
      title: ExecutionError
      type: object
    ExecutionErrorResponse:
      description: |-
        An error body.

        `run_id` and `workflow` are present when the Execution API provider already knows which run the request
        concerned, so a caller can attribute a failure without echoing its own request back.
      properties:
        error:
          $ref: "#/components/schemas/ExecutionError"
        run_id:
          anyOf:
            - type: string
            - type: "null"
          title: Run Id
        workflow:
          anyOf:
            - type: string
            - type: "null"
          title: Workflow
      required:
        - error
      title: ExecutionErrorResponse
      type: object
    HealthResponse:
      properties:
        status:
          const: ok
          title: Status
          type: string
      required:
        - status
      title: HealthResponse
      type: object
    RunResponse:
      description: |-
        One run as the Execution API provider reports it.

        Optional result, diagnostic, and post-processing fields are omitted rather
        than null until they exist, which is why the route serializes with
        `exclude_none`.
      properties:
        artifact_storage:
          anyOf:
            - $ref: "#/components/schemas/ExecutionArtifactStorage"
            - type: "null"
        error:
          anyOf:
            - $ref: "#/components/schemas/ExecutionError"
            - type: "null"
          title: Error
        memory_processing:
          anyOf:
            - additionalProperties: true
              type: object
            - type: "null"
          title: Memory Processing
        result:
          title: Result
        run_id:
          anyOf:
            - type: string
            - type: "null"
          title: Run Id
        status:
          enum:
            - queued
            - running
            - succeeded
            - failed
          title: Status
          type: string
        workflow:
          anyOf:
            - type: string
            - type: "null"
          title: Workflow
      required:
        - status
      title: RunResponse
      type: object
    RunStatusQuery:
      description: Which runs a status query wants status tokens for.
      properties:
        run_ids:
          items:
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$
            type: string
          maxItems: 200
          minItems: 1
          title: Run Ids
          type: array
      required:
        - run_ids
      title: RunStatusQuery
      type: object
    RunStatusResponse:
      properties:
        missing:
          description: Requested run IDs the Execution API provider holds no record for.
          items:
            type: string
          title: Missing
          type: array
        runs:
          items:
            $ref: "#/components/schemas/RunStatusToken"
          title: Runs
          type: array
      required:
        - runs
        - missing
      title: RunStatusResponse
      type: object
    RunStatusToken:
      description: |-
        One run's status, without its record.

        A polling caller asks whether anything changed far more often than it needs results, so
        this carries no result: the full record is fetched once per terminal run.
      properties:
        run_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$
          title: Run Id
          type: string
        status:
          description: The run's status as the workflow gateway reports it.
          title: Status
          type: string
      required:
        - run_id
        - status
      title: RunStatusToken
      type: object
  securitySchemes:
    HTTPBearer:
      description: Bearer credential accepted by the Execution API provider.
      scheme: bearer
      type: http
info:
  description: Hand-maintained single source of truth for the Execution API HTTP boundary. Provider implementations and generated types consume this document; service code does not generate it.
  title: Sec Review Bot Execution API
  version: 0.1.0
openapi: 3.1.0
x-contract-source: hand-maintained
paths:
  /healthz:
    get:
      description: Report whether the Execution API process is serving requests. Requires no credential.
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: Successful Response
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionErrorResponse"
          description: Internal Server Error
      security: []
      summary: Healthz
  /v1/runs/status:
    post:
      description: Return status tokens for a bounded set of run IDs.
      operationId: getRunStatuses
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunStatusQuery"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunStatusResponse"
          description: Successful Response
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionErrorResponse"
          description: Bad Request
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionErrorResponse"
          description: Payload Too Large
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionErrorResponse"
          description: Internal Server Error
      security:
        - HTTPBearer: []
      summary: Get Run Statuses
  /v1/runs/{run_id}:
    get:
      description: Return the current public record for one execution run.
      operationId: getRun
      parameters:
        - in: path
          name: run_id
          required: true
          schema:
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$
            title: Run Id
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
          description: Successful Response
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionErrorResponse"
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionErrorResponse"
          description: Internal Server Error
      security:
        - HTTPBearer: []
      summary: Get Run
  /v1/workflows/{workflow}/runs:
    post:
      description: Validate and submit one workflow run for asynchronous execution.
      operationId: createRun
      parameters:
        - in: path
          name: workflow
          required: true
          schema:
            enum:
              - issue-review
              - pull-request-review
              - repository-review
            title: Workflow
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
          description: Successful Response
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionErrorResponse"
          description: Bad Request
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionErrorResponse"
          description: Conflict
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionErrorResponse"
          description: Payload Too Large
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionErrorResponse"
          description: Internal Server Error
      security:
        - HTTPBearer: []
      summary: Create Run
